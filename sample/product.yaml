# products/sample.yaml — the sample product: a second product with conventions of its own, run by
# ASF's own tests (tests/test_sample_product.py) so "works for any product" is something CI proves.
# The test copies sample/ into a temp dir and replaces @REPO@ and @BACKLOG@ with the copies' paths.
product: sample
repo_dir: @REPO@
backlog_dir: @BACKLOG@
main: main
conventions:
  specs_dir: specs
  plans_dir: plans
  reviews_dir: reviews
  review_pattern: reviews/{slug}-r{n}.md
  lane:
    review:
      code: none          # the sample lands a Task on its gate alone, no review session
  intake_dir: cards
  default_bug_epic: E-0001
  branch_prefixes:
    code: feature/
    task: feature/
    fix: bugfix/
    spec: spec/
    plan: plan/
ci:
  provider: none
  test_command: python3 -m unittest discover -s tests
capacity:
  sessions: 1
  batch:
    per_run: 2
    parallel: 1
    runners: 1
token_caps:
  default:
    input: 8000000
    output: 1000000
    cache_read: 400000000
    cache_write: 40000000
deploy_sha: none
approvals:
  spend_money: human-now
  touch_production: human-now
  touch_security: human-now
  touch_customer_data: human-now
  touch_legal: human-now
  new_epic: human-now
  merge_amendable_set: human-now
  merge_routine_pr: auto
  file_bug: auto
  decide_feature: human-now
  decide_bug: human-now
steps:
  batch: off
  daily: off
clocks:
  record:
    steps: [record]
    every: 5m
  dispatch:
    steps: [health, groom, wave, prs, harvest, batch]
    every: 10m
  daily:
    steps: [daily]
    at: "06:50"
  shadow:
    shadow: true
    every: 30m
job_grants: []
