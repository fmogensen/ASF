# ~/.ASF/products/<name>.yaml — one file per product. Copy this to e.g. ~/.ASF/products/sample.yaml,
# fill in your own values, and pass --product sample (or set default_product in config.yaml, or
# $ASF_PRODUCT) so the tools resolve it. Every key below is read by asf.env.Product; nothing
# product-specific belongs in the asf/ package itself — if a tool needs a new fact about a
# product, it becomes a new key here, not a literal in code.

# The product's own name, matching this file's name (products/<name>.yaml).
product: sample

# github.com slug, e.g. "acme/sample" — used for `gh` calls (PRs, Actions runs, issues).
repo_slug: acme/sample

# where the product's own code repo is checked out on this machine.
repo_dir: ~/Code/acme/sample

# the branch releases deploy from.
main: main

# your checkout of this product's record (the backlog) — a git repo with an origin, holding
# epics/ features/ stories/ tasks/ bugs/ decisions/ rules/ inbox/ groom/ releases/ metrics/
# index.json. The tick never writes it: it works in its own clone (~/.ASF/state/<name>/record/)
# and pushes to origin, so `git pull` here before reading the tables.
backlog_dir: ~/Code/acme/sample-backlog

# conventions: every path/naming choice the record and tick tools need, so no tool hardcodes a
# directory name or branch prefix.
conventions:
  specs_dir: docs/specs
  plans_dir: docs/plans
  reviews_dir: docs/reviews
  briefs_dir: docs/briefs
  # the README `asf readme` renders spans into, and the committed facts file it writes them from
  # (defaults shown).
  readme: README.md
  readme_facts: docs/readme-numbers.json
  # the branch each job kind pushes: code (a Task), fix (a Bug), spec, plan, groom. Any other key
  # (task, batch here) only adds a prefix the prs step and harvest recognise; `legacy: [..]`
  # names old prefixes that are recognised and never minted.
  branch_prefixes:
    code: worker
    fix: fix
    spec: spec
    plan: plan
    task: task
    batch: batch
    groom: groom               # the groom session's throwaway branch
  # the filename pattern a review lives at, {n} is the review round number. A spec or plan is
  # approved when its newest review says APPROVED, or when the document is on main.
  review_pattern: "docs/reviews/{n}-{slug}.md"
  # how a finished branch reaches the trunk: fast-forward (harvest gates it with ci.test_command
  # and pushes it to main) | pull-request (the prs step opens a PR; on a PR host harvest merges
  # it once approvals allow, checks are green and — for code — the newest ASF review of its item
  # reads `verdict: approved`; a docs-only spec/plan PR needs no review).
  # Unset: fast-forward when steps.batch is off or unset, else pull-request.
  # landing: fast-forward
  # a PR whose CI path-filters suites: a required check the workflow itself skipped (job `if:`
  # false) or never created by a job its own workflows declare counts as satisfied once every
  # workflow run on the head completed, a required check concluded success and none is red
  # (path-filtered, the default) | never (a skipped or missing required check never merges).
  # PR merges only — deploys never.
  # merge_skipped: path-filtered
  # who clicks merge on a green, reviewed PR: manual (the operator; the default) | auto (the lane,
  # by `gh pr merge`) | queue (the lane, through its own serialized merge queue: green PRs are
  # merged onto the trunk tip as one batch ref, CI runs once on that sha against the product's
  # whole required set — landing_checks plus deploy_sha.prod.required_jobs_from, read at the
  # batch sha; a skipped required check is not green — and the trunk is fast-forwarded to that
  # exact sha. A moved member head or a trunk that moved past the batch drops it and cuts it
  # again; a red batch splits in two, a red batch of one goes back to its session).
  # merge: manual
  # The same key as a map adds the opt-in factory-only rule (default off): a CI check
  # (`bash tools/check_factory_only.sh`, which runs `python3 -m asf.factory_only --product-file
  # .asf/product.yaml`) refuses a PR into the trunk whose head branch is under none of
  # branch_prefixes. Escapes: a release tag, and a PR touching nothing but bot_paths (default
  # [CHANGELOG.md]). require_item_id also asks that the name after the prefix be a card's id, so a
  # hand `fix/typo` cannot pass on the fix lane's prefix. CI cannot read THIS file — it is the
  # operator's; the rule's inputs are committed to the product's own repo as .asf/product.yaml.
  # merge: {mode: manual, factory_only: false, require_item_id: false, bot_paths: [CHANGELOG.md]}
  # the queue's shape under `merge: queue` (defaults shown): the ref prefix the product's CI runs
  # its full matrix on, PRs per batch, batches in flight (each stacked on the one before), and how
  # long a batch may wait for its checks before it is cut again.
  # merge_queue:
  #   ref_prefix: batch/
  #   batch_size: 3
  #   inflight: 2        # 0 pauses new cuts (the first-class way to hold the queue for a pin
  #                       # move): the chain already in flight still lands, a batch that is
  #                       # dead — a required check concluded red on it — is still dropped; only
  #                       # the next cut waits. `asf doctor`'s `queue pause` row says so while it
  #                       # holds. Never pause this way by adding the ref prefix to
  #                       # conventions.protected_refs instead — that also refuses refguard's own
  #                       # delete of a batch ref once it is dead, and the two deadlock.
  #   timeout_min: 360
  #   stuck_min: 90       # a batch pending this long with no run queued or in progress on its
  #                       # sha is re-run once, then cut again (a cancelled required check: at once)
  #   start_kind: trunk   # the CI start queue admits the batch push as a trunk start (trunk priority,
  #                       # every runner, never held at capacity.ci) | batch (the batch step's kind).
  #                       # Which runners the run lands on is the workflow's runs-on for a push of
  #                       # the batch ref — a push, not a pull_request, so main's own class.
  #   precut_check: make precut-check   # (unset: none, the cut is as before) the product's cheap
  #                       # checks of the merged tree (one command or a list), run as each PR merges
  #                       # into the batch, before the push: a PR that turns it red is dropped from
  #                       # the cut, named, and sent back — a merge=union file merges clean in git,
  #                       # only a check of the tree sees two rows claiming one id
  #   precut_check_timeout_s: 120
  #   deterministic_jobs: []   # (default none) CI jobs whose red is deterministic — a registers or
  #                       # rules check answers the same on every run: flake triage never re-runs
  #                       # it, the blame sends the member whose rows it names back at once. A job
  #                       # whose failed step runs a precut_check command is deterministic too.
  #   hold_culprit: on    # (default on) a member a deterministic red named is held out of every
  #                       # later cut until its head changes: the same tree answers the same
  # harvest: one gate over every eligible branch (combined, bisecting on red) or per-branch; the
  # most branches one run gates; seconds before a gate is killed and counted red.
  # harvest:
  #   gate: combined
  #   branches_per_tick: 12
  #   gate_timeout_s: 600
  # the dwell-time watchdog (asf.dwell; `asf watchdog`, and the tick's `watchdog` step, which runs
  # with every wave): the longest each state may last, in minutes, or `off` (defaults shown).
  # Only check_cancelled (re-run the failed jobs once per head) and ungrantable_hold (drop it)
  # act; every other breach is a `watchdog: BREACH` line, a `watchdog` event and a Bug.
  # watchdog:
  #   tick_running: 15
  #   pr_green_not_landing: 30
  #   check_cancelled: 10
  #   green_batch_blocked: 10
  #   chain_no_cut: 20
  #   launchable_idle: 10
  #   ungrantable_hold: 0
  #   record_behind: 15
  #   runner_offline: 10
  #   branch_no_pr: 10
  #   wave_latency: 2          # the last tick's start → its wave's start (asf status: Wave latency)
  # prs_per_tick: 6
  # land_window_days: 7    # the window `asf status`'s Features row measures time-to-land over
  # the heading a plan uses to mark one task's section (default "### Task"; not read by the
  # current tools).
  task_heading: "## Task"
  # asf.tick.migrate: the one spec file (if any) excluded from the "every other main spec"
  # decision-row scan because it's already read separately as the product's design spec.
  design_spec_name: design.md
  # asf.groom.inbox / asf.tick.file_bugs: the Epic an inbox Bug or a filed Bug is parented under
  # when no explicit parent is given. Leave unset to have groom ask instead of guessing.
  default_bug_epic: E-0001
  # asf.groom.shape: how many leading path segments make one area when the groom proposes a split,
  # and the most globs a Task may write and still be batched. Both shown at their defaults.
  # area_depth: 2
  # batch_max_globs: 2
  # asf.record.slice: the unit a Feature is built and landed in. `task` (the default) is one
  # branch, one PR, one review per Task. `feature` makes the whole Feature one delivery — its
  # Tasks one branch, one PR, one CI run, one review, one commit per Task — cut into ordered
  # slices along the plan's `after:` only past `slice_max_tasks` Tasks or `size.medium_max_files`
  # footprint entries. Both shown at their defaults.
  # delivery: task
  # slice_max_tasks: 6
  # asf.feeder.widen: the most paths one footprint widening adds to a Task's writes: — more is a
  # reshape of the Task. Shown at its default.
  # widen_max_files: 5
  # asf.feeder.rows: stories first. A Feature with no Story is not planned (no plan, replan or
  # delivery-plan row); its next step is a `NO STORIES → SPEC-AMEND` row that derives Stories
  # with checkbox acceptance lines from its spec, plan and landed Tasks. A Feature already in
  # build keeps its build rows. Shown at its default; `false` turns the gate off.
  # feeder:
  #   stories_before_plan: true
  # asf.briefs.preamble: the lines the preamble may run to, and the most documents and tests whose
  # line counts it measures per launch. Both shown at their defaults.
  # preamble_max_lines: 120
  # preamble_max_files: 12
  # read as conventions.models.<kind> — the operator's override of the model label a kind runs
  # on. Three labels, mapped to real model ids in ~/.ASF/config.yaml under worker_pool.models:
  #   heavy  judgement — spec, spec-amend, plan, review, adjudicate, groom, reshape
  #   light  code      — coder, fixer, fix-bug, correct
  #   cheap  clerical  — rebase, close, groom-clerk
  # Unset for a kind means the default above. Argue a change against the numbers, not taste:
  # `asf improve` prints minutes-per-landing per kind and per model every week, and the table in
  # docs/config.example.yaml is the measurement this routing was chosen from.
  # models:
  #   review: light
  # F-0031: globs whose match makes a landed branch's merge class merge_amendable_set (needs a
  # person, see approvals: below) rather than merge_routine_pr. The factory's own rules.
  amendable_paths: [rules/*, docs/CONSTITUTION.md]
  # asf.evidence.discover: the parity matrix file read for Story status. Leave out and the
  # product has no such thing — nothing looks for it.
  matrix_path: docs/matrix.md
  # asf.evidence.migrate_sources: a decisions file mined for D-rows. Leave out and the product
  # has no such thing — nothing looks for it.
  decisions_file: docs/decisions.md
  # asf.evidence.migrate_sources: a directory of hotfix/diagnostic reports adopted as backlog
  # items. Leave out and the product has no such thing — nothing looks for it.
  reports_dir: docs/reports
  # a regex over a file name in reports_dir; unset matches every .md. Leave out and the product
  # has no such thing — nothing looks for it.
  report_pattern: "hotfix-.*\\.md"
  # How the product is versioned (asf.metrics.version_conf). With none of these keys a release's
  # version is its short sha: the rollup cuts no tag and writes no changelog — nothing reaches the
  # product's repo but the work itself.
  #   tag_pattern: a regex over tag names — the product's own version tags; a release's version
  #                is the newest one on its sha, else the short sha. The rollup cuts none.
  #   cut:         true — the rollup cuts its own v<major>.<minor>.<patch> tags (below; opt-in,
  #                version_file names the line it starts from). A product versioned by its own
  #                release workflow leaves it off and names its tags in tag_pattern.
  #   changelog:   true — file each version's notes in changelog_file (opt-in; on with cut
  #                unless set false here).
  # version: {tag_pattern: '^v\\d+\\.\\d+\\.\\d+$', cut: false, changelog: false}
  # asf.metrics release: a product with no deploy_sha ships its green trunk (B-0077); with
  # version.cut the rollup
  # tags it when an item landed and release_min_interval has passed since the last release,
  # `v<major>.<minor>.<patch>`: major.minor is the
  # lowest-ranked open Epic whose title carries a version ("… 0.2 — …"), else this file's; the
  # patch is that line's highest plus one (`.0` opens a line). The tag IS the version — this
  # file is never rewritten. It writes releases/<day>-<sha7>.md (a `version:` line and the
  # `## Notes`), the tag's message, a GitHub Release and an entry in changelog_file. A legacy
  # `release-<day>-<sha7>` tag is adopted as the next patch at the same sha, and kept.
  version_file: src/sample/__init__.py
  # the least time between two trunk releases, <n>s|m|h|d (default 60m); several a day are fine.
  release_min_interval: 60m
  # the release notes file on the trunk, newest first (default CHANGELOG.md).
  changelog_file: CHANGELOG.md
  # the notes' Upgrade line; {repo_slug} and {tag} substituted; "" leaves it out.
  release_install: 'pipx install --force "git+https://github.com/{repo_slug}.git@{tag}"'
  # asf.groom.inbox: where a dropped .md becomes a card. Leave out and the product has no such
  # thing — nothing looks for it.
  intake_dir: inbox
  # globs that are documentation beside specs_dir/plans_dir/reviews_dir: a branch touching only
  # these lands as docs, and a trunk that moved only here does not re-gate (default []).
  doc_paths: [README.md, docs/guide/*]
  # globs many Tasks touch without owning (lockfiles): no footprint overlap, one per merge (default []).
  shared_paths: [uv.lock]
  # append-only shared files every Task may add a row to (a registry, a band table): inside every
  # Task's writes: without a widening, and no footprint overlap (default []).
  shared_writes: [docs/registry.md]
  # pages a customer reads (asf/customer_content.py): a branch adding an internal note, TODO,
  # lorem ipsum or unresolved placeholder under these globs is held (file:line), a deploy whose
  # tree carries one is refused, and a review of such a diff owes a `read as the customer` row.
  # forbidden_markers (regexes) replace the defaults when set. `asf doctor` names a product that
  # deploys without this block.
  # customer_content:
  #   paths: [apps/site/app/legal/**, apps/site/content/**]
  #   forbidden_markers: ['(?i)\[\s*legal\s*:']
  # the security block (asf/security): which of a diff's files are sensitive, and how the host's
  # own secret- and dependency-scanning alerts are read as this factory's Bugs (R-0009, docs/guide
  # /security-checks.md). All three keys are validated (conventions.validate_mapping) whether or
  # not this block is set.
  # security:
  #   # class name -> globs: the precheck pass reads these to floor a sensitive diff's review
  #   # level (default {} — nothing is sensitive).
  #   paths:
  #     auth: [apps/*/auth/**]
  #     payments: [apps/*/billing/**]
  #     secrets: ['**/*.pem', '**/*.key']
  #     infra: [infra/**, terraform/**]
  #     deploy: [.github/workflows/**]
  #     pii: [apps/*/customers/**]
  #   # hours a secret- or dependency-scanning read may age before an unread feed is itself a
  #   # violation rather than a pass (R-0009; default 24). The value read, never the alerts.
  #   alerts:
  #     max_age_h: 24
  #   # validated, but nothing reads it yet (the nightly exposed-port probe was cut from this
  #   # Feature's reshape; docs/guide/security-checks.md says so).
  #   ports:
  #     boxes: [lane-1, lane-2]
  #     workflow: probe-ports.yml
  #     artifact: ports.json
  #     max_age_h: 24
  #     ports: [22, 443]
  # the PR lane: which landing class needs an approved ASF review before the gate (none |
  # required; default docs: none, code: required), and how long an open lane state may sit
  # unchanged and unheld before it is stale (<n>s|m|h|d, default 2d). One branch a tick takes a
  # shared_paths/shared_writes file; a branch held WAITING on one for shared_path_aging goes first
  # next time, oldest wait first (<n>s|m|h|d, default 30m; 0s: first come). Block maps only.
  lane:
    review:
      docs: none
      code: required
    stale_after: 2d
    shared_path_aging: 30m
    # where the pre-push check runs on a head the lane rebuilt (drop copies, rebase, transplant):
    # background (a detached job with its own lock; the next pass reads its result), session (the
    # branch goes back to its session to rebuild and check) or off (pushed unchecked, CI gates it).
    # Never inside the tick.
    rebuild_check: background
    # the seconds one lane pass may spend advancing branches; the rest wait for the next pass
    # (0: no budget)
    pass_budget_s: 300
  # stale means act (asf.stale_act; `asf stale --act [--dry-run]` by hand): a leftover past its
  # deadline is acted on, every action a line in state/<product>/stale-acts.jsonl. `act`: the
  # tick acts (true) or only prints its `would …` lines (false, the default for every product —
  # the factory's own included; its own product file opts in). `pr`: an open PR the lane holds STALE past `pr_after` is archived as
  # archive/pr-<n>, closed with its reason, its branch deleted, and its open item re-planned.
  # `task`: an Active Task past `task_factor` x its task_active limit, its branch unmoved as long
  # and over `task_behind` commits behind the trunk, is re-planned from the trunk (its branch
  # archived, its PR closed). `pr: false` / `task: false` turn a kind off. A product with no PR
  # host skips the pr kind as not applicable.
  # stale:
  #   act: true
  #   pr: true
  #   pr_after: 3d
  #   task: true
  #   task_factor: 3
  #   task_behind: 200
  # a command run in every fresh worker worktree before its session starts (default: none).
  # worktree_setup: make deps
  # commands the landing gate runs after test_command, each red on a non-zero exit — the
  # product's own lint or structure checks (default: none, for every product).
  # gate_checks: [bash tools/check_generic.sh, bash tools/check_conventions.sh]
  # GitHub access is per product, not per account: a fine-grained token covers one GitHub owner,
  # and this product may live under a different owner than an account's other products. VARIABLE:
  # file — read at every launch, merged over the account's own worker_pool.accounts[].auth_env,
  # this product's value winning for a variable both set; a missing file refuses the launch
  # (NEEDS OPERATOR), the same as an account's own (see guide/operating.md, Safety).
  # auth_env:
  #   GH_TOKEN: ~/.ASF/secrets/sample.gh
  # a product whose code PRs its external CI gates (landing: pull-request with landing_checks,
  # or landing_checks_missing wait for code): regexes naming its own full-suite or full-gate
  # commands. The approvals hook refuses a session a Bash simple command one matches (leading
  # VAR=value dropped, heredoc bodies ignored) — the full suite is that CI's — and records it for
  # audit only: no hold, nothing parked. Match the unscoped forms only, so a runner given paths
  # (a targeted run) stays allowed. Ignored for any other product (default: none).
  # full_suite_commands: ['^make test$', '^make check\b']
  # the product's own check and test commands: a code session may run any of these, the harvest
  # also runs them itself on the pushed head and attaches their output to the review brief
  # (default: none — asf.harvest's own gate scripts, if any, still run under ASF_GATE_SCRIPTS).
  # check_commands:
  #   - bash tools/check_conventions.sh
  #   - make lint
  # whether the approvals hook grants a factory session's Bash call outright when the command is
  # provably read-only (git reads, ls/cat/head/tail/grep/rg/find/wc, cd, and this product's own
  # check_commands/pre_push_check/test_command) — compound, `cd X && …` and `$?` forms included.
  # A mutating command is always governed as today, whatever this says (default: true).
  # read_only_allow: true
  # the savings pass's window and its six thresholds (F-0100 §2.9): a key left out keeps the
  # documented default here; `asf doctor`'s `savings` row is red over an unknown key or a value
  # that is not a positive number.
  savings:
    window_days: 7
    min_landings: 5          # fewer landed changes than this: read, print, propose nothing
    preamble_ratio: 2.0      # a kind's median input tokens over all kinds'
    gate_minutes_max: 20.0   # gate minutes per landed change
    rounds_per_landing: 1.3
    step_duration_ratio: 1.5 # today's median step duration over the window's
    spend_ratio: 1.5         # a kind's median dollars per landed change over all kinds'
    failure_class_count: 3   # one gate signature, in the window
  # flags: every behaviour switch, in one map. Never validated and kept verbatim by every earlier
  # reader, so a product pinned to an older asf still loads a file that sets a new one. An
  # unset flag is its documented default; a name this release does not read is listed by
  # `asf doctor`'s `product` row (asf.conventions.KNOWN_FLAGS).
  # flags:
  #   mechanical: on     # conflict/copies/merge → the lane rebases it (a pending hold retried once the trunk moved, before any adjudication); naming → reworded; footprint → the widening verdict in the hold; not pushed → published from the worktree, review/notes rounds archived; hook refused → trunk history dropped and published again; an approval carried over the lane's own clean rebuild (default off)
  #   plan_ahead: 2
  #   console_wait: aside  # hold (default) | aside: an item whose only row waits on the console orders nothing
  #   verdict_block: warn   # off (default) | warn | on: a review's ```verdict block is read
  #                         # first (the table is the fallback); at `on` the Stop gate refuses
  #                         # a review that ends without one bound to its head
  #   id_claim: push   # push (default) | off: a new S-/T-/B- id, and a session's whole
  #                    # BACKLOG_ID_RANGE block, is taken by a create-only ref
  #                    # refs/asf/ids/<P>-<nnnn> on the record's origin; a cloud session reads
  #                    # its block from its brief. off: the host-local reservation only
  #   stale_ref_reopens: 1     # a PR red on a merge ref from before the trunk moved is reopened
  #                            # for a fresh run (asf.stale_ref) at most this often per head (0: never)
  #   stale_ref_job_paths: {}  # job → globs it reads, e.g. {e2e: ["web/*"]}: reopen only when the
  #                            # trunk changed one; unset: the files the failing log names, else any
  #   flake_skip_reproduced: on  # a red reproduced on two merge refs (same check, same failing
  #                              # test) is a defect: no blind flake re-run (asf.flake). off: re-run
  #   trunk_red_trunk_runs: on   # a red manual/schedule/push run of the trunk's workflow on the
  #                              # trunk's tip confirms trunk red on its red jobs (asf.trunk_red):
  #                              # no landing is sent to a correct round for it. off: only ASF's own
  #                              # dispatched full run confirms
  #   relaunch_same_report: 2  # asf.workers.loops.SAME_REPORT (default 2): ended runs of one
  #                            # job since the item's latest unpark that end on the same report
  #                            # (shas masked) with the card unchanged before the loop guard
  #                            # parks it — a moving head alone buys no more rounds. off: rule
  #                            # disabled
  #   relaunch_daily_cap: 6    # asf.workers.loops.DAILY_CAP (default 6): launches of one job in
  #                            # the trailing 24h since the latest unpark before the loop guard
  #                            # parks it, whatever changed between them. off: rule disabled
  #   upgrade: notify    # auto | notify (default) | off — how this product's tick takes a new
  #                      # ASF *release* (F-0112): auto installs it, notify says so once per tag,
  #                      # off says nothing. A word that is none of the three reads as notify and
  #                      # is a doctor RED. This is the *release* channel; a product whose repo is
  #                      # ASF's own source is on the trunk channel instead, under approvals.upgrade
  #                      # above.
  #   groom:
  #     reask_days: 7     # asf.groom.sticky (default 7): days an answered groom question's
  #                       # digest stays sticky — unchanged, it is dropped from the report
  #                       # instead of asked again. off: never sticky, always re-asked
  #     rank_owner: code  # code (default) | adjudicator: under code, `rank <n>` answers are
  #                       # skipped (the feeder's own order owns rank); under adjudicator, the
  #                       # groom brief asks for it as before
  #     structural: report  # report (default) | ask: a no_stories/no_tasks line is printed as
  #                         # a report line, not asked — an undecided new/3-day Feature is still
  #                         # asked either way

# CI: which provider runs checks, which workflow file, budgets and runner labels.
ci:
  provider: gh-actions   # gh-actions | other | none (no PR host: no repo_slug, no gh) | vm
  # the gate: the command a branch must pass before harvest lands it (none: no test gate).
  test_command: make test
  # read as conventions.ci_workflow — the workflow whose runs on the trunk are the green
  # evidence.
  workflow: ci.yml
  # read as conventions.ci_workflows — more workflows the metrics backfill always keeps,
  # matched against a run's display name or its file's basename. Unset (the default): every
  # workflow a pull request or the trunk itself runs, and a merge queue's own batch/cut runs,
  # already enter the `ci` stream on their branch or trigger alone — this is only for a
  # workflow neither of those reaches (one dispatched by hand, say) that the product still
  # wants read for its reds and its PR-CI targets.
  # workflows: [tests.yml, lint]
  # read as conventions.ci_dev_job — the job in that workflow whose success marks the dev sha.
  dev_job: test
  # F-0043: the two waste numbers the daily scorecard prints as value against target, and the
  # volume below which it prints no verdict at all. Shown at their defaults.
  targets:
    cancelled_pct: 15    # cancelled runner minutes, as a share of all runner minutes
    red_rate_pct: 15     # CI runs ending red, as a share of all runs
    min_minutes: 60      # no verdict on cancelled_pct below this many runner-minutes in 7 days
    min_runs: 20         # no verdict on red_rate_pct below this many runs in 7 days
  budgets:
    minutes_per_day: 500
  runner_org: acme
  labels:
    - self-hosted
    - linux
  # pool: the self-hosted runners this product's jobs run on — the single source of truth for
  # their labels (docs/guide/ci-runner-pool.md). `role` is the one routing label a runner answers
  # to and names a capability (heavy, light, …); `provider` and `size` are inventory and never go
  # in a job's runs-on. `slots` (default 1) is how many jobs the runner takes at once; the sum of
  # every runner's slots is this product's CI ceiling unless capacity.ci below sets one.
  # `asf doctor` reports drift against it; `asf ci reconcile` plans (and, with --apply, writes)
  # exactly: the host's own labels + the role + `provider-<provider>`.
  pool:
    - {runner: ci-1,  box: box-1, provider: alpha, size: 8c-16g, role: heavy, slots: 1}
    - {runner: ci-1b, box: box-1, provider: alpha, size: 8c-16g, role: light}
    - {runner: ci-2,  box: box-2, provider: beta,  size: 8c-24g, role: heavy}
  # ci.provider: vm (asf.ci_vm) — external CI on any ssh-reachable machine, instead of the pool
  # above: a named ssh target per host (`slots`, default 1, is how many jobs it runs at once;
  # `root`, default .asf-ci under the ssh user's home, is the only place on the host this writes)
  # and a named command per job (`required`, `timeout_min` default 45, and `labels` it needs a
  # host's own labels to be a superset of).
  # provider: vm
  # hosts:
  #   - {name: ci-1, ssh: ci-1.example, labels: [linux, heavy], slots: 2, root: /srv/asf-ci}
  #   - {name: ci-2, ssh: ci-2.example, labels: [linux, light]}
  # jobs:
  #   lint: {command: 'make lint', required: true, timeout_min: 10, labels: [light]}
  #   gate: {command: 'make test', required: true, timeout_min: 45, labels: [heavy]}

# capacity: this product's share of the factory. Each is a ceiling, capped in turn by
# config.yaml's capacity.total and by what worker_pool.accounts can host.
capacity:
  sessions: 3         # concurrent worker sessions for this product
  ci: 2               # CI start gate: the batch step waits while this many ci.workflow runs are in
                      # flight (PR and trunk runs start regardless); overrides the ci.pool slot sum
  weight: 1           # share of the worker pool against other active products (default 1); 3 = three times asf's
  batch:              # passed to a batch step as ASF_CAPACITY_*; harvest's PR merges obey it too
    per_run: 8        # batches per run (harvest: PR merges per run)
    parallel: 2       # batches in flight at once (harvest: PRs in a GitHub merge queue)
    runners: 4        # runner slots one run may claim

# kernel: ASF 0.2's kernel (asf.kernel.settings). Every key shown is its default; leave the block
# out to take them all. `asf kernel install` writes the two launchd jobs from tick/watch,
# `asf kernel watch` is the keep-alive, `asf kernel gate` checks the proof criteria.
kernel:
  tick:
    interval_s: 120         # the tick job runs every this many seconds
  launch:
    max_sessions: 6         # live sessions the tick launches up to (the local default below)
    # local_max: 6          # seats on this host (unset: max_sessions)
    # cloud_kinds: [coder, fix-bug, spec, plan]   # brief kinds that may go to cloud; the rest
    #                       # (review, light-review, correct, rebases) take a local seat — a cloud
    #                       # review pushes a report commit to the PR branch and restarts its CI
    cloud_max: 0            # seats on the product's cloud lane (`cloud:` above: enabled, not
                            # mode off, runtime claude-remote or actions); the tick launches up to
                            # local_max + cloud_max. Cloud first — a launch that needs the host
                            # (a rebase round, a cloud.local_only kind) takes a local seat — then
                            # local. A cloud session's liveness is its remote run's status, its
                            # REPORT the report commit it pushes; a failed create falls back local
                            # and counts on the lane's breaker (cloud.fallback_*).
    rank: inherit           # inherit: a Task takes its nearest ancestor's rank; own: only its own
  models:                   # the model each brief kind launches on: a model id, or a
                            # worker_pool.models label (heavy, light, cheap)
    coder: claude-sonnet-5
    fix-bug: claude-sonnet-5
    correct: claude-sonnet-5        # a fix round on an open PR
    review: claude-sonnet-5
    light-review: claude-sonnet-5   # a docs-only PR's review (review.light_paths)
    spec: claude-opus-5
    plan: claude-opus-5
  review:
    light_paths: ['docs/**', '*.md']   # a PR whose every file matches these (or the product's
                            # specs/plans/reviews dirs) gets a light review: a short checklist
  briefs:
    max_appended_chars: 4000  # the kernel's findings + operator answers appended to a brief,
                            # newest kept; the tick logs each cut (0: no cap)
  landing:
    update_parallel: 2      # the merge train: at most this many behind Landing PRs are updated
                            # (and re-run CI) at once, by rank then oldest PR; the rest wait
  watch:
    interval_s: 600         # the keep-alive job runs every this many seconds
    stale_after_s: 900      # a plan older than this, and no tick running: kickstart the tick
  idle_alarm:
    enabled: true           # the plan carries an `idle` record when seats are free, work waits,
    min_free_seats: 1       # and nothing launches; tick prints IDLE, status shows it on top
  stuck:                    # Stuck never sits: what the kernel can resolve, it resolves
    escalate_after_h: 0     # a Stuck owned by a session or CI this old (0: the tick it appears):
                            # a red off the PR gets one more rerun, then a fix round; a stopped
                            # session one relaunch with its report as findings; the fix-round
                            # cap one extra round on strong_model with every finding
    rebuild_after_h: 0      # a conflict the rebase could not resolve, or the cap after that extra
                            # round, this old: archive the branch to archive/<branch>, close the
                            # PR, rebuild fresh from the trunk — at most once per item
    strong_model: claude-opus-5   # the extra round's model. Operator questions are never
                            # resolved: `asf kernel status` puts them in a "needs you" block
  gate:
    window_h: 24            # first-push-green is measured over PRs opened in the last window_h
    first_push_green_min: 0.7
    landed_min: 5           # Tasks/Bugs landed via kernel PRs since `since`
    silent_stuck_max: 0     # Stuck items with no reason or no owner
    # since: 2026-10-09T14:00:00Z   # the proof's start
  waits:
    targets:                # per wait class (`asf kernel waits`): a wait older than its target is
      seat: 10m             # flagged ⚠ there and counted on the tick line ("over-target waits");
      ci: 10m               # classes: seat (Ready, no seat), ci (checks running), review (awaiting
      review: 30m           # a verdict), train (queued for update), merge (green, waiting on
      train: 30m            # GitHub), conflict, stuck (every stuck:<owner>), after (a dependency),
      merge: 10m            # parked. after and parked have no target unless set. A duration is
      conflict: 0m          # 30s, 10m, 2h, 1d or whole seconds
      stuck: 0m

# token_caps: runaway ceilings on one run's tokens, per dimension, never summed. `default` applies
# to every job kind; a kind (spec, review, fix, code, plan, ...) narrows or widens single dimensions.
# A cap is a whole number of tokens, or `off` for none. Leave the block out for the built-in caps.
token_caps:
  default:
    input: 8000000
    output: 1000000
    cache_read: 400000000
    cache_write: 40000000
  # spec:
  #   input: 4000000

# how a deployed sha is discovered, for the evidence pass and release notes — and, per
# environment, whether the tick deploys it (asf.harvest.deploy).
deploy_sha:
  provider: github-deployments   # github-deployments | fly | vercel | script
  # each environment's mode, and what every tick, `asf status` and `asf prod` say about it:
  #   auto   — the tick dispatches `workflow` for the environment's candidate sha
  #   manual — nothing dispatches; the views name the green sha waiting on a hand dispatch
  #   ci     — (dev only) the product's CI deploys dev itself (ci.dev_job in ci.workflow);
  #            ASF only observes which trunk sha dev runs
  # The same rules hold for every environment: no dispatch while a run of its workflow is
  # queued or running, a sha whose deploy failed is never retried (the next green one is), and
  # a red trunk never deploys. A dev with no mode is not managed; prod's mode defaults to manual.
  dev:
    mode: ci                     # auto | manual | ci
    # workflow: deploy-dev.yml   # auto/manual: the workflow_dispatch workflow deploying dev
    # input: sha                 # the workflow_dispatch input carrying the sha (none: no input)
  prod:
    mode: manual                 # auto | manual
    # read as conventions.deploy_workflow — the workflow whose newest success marks the prod sha
    workflow: deploy-prod.yml
    # input: sha
    # from: ci                   # ci: the newest green ci.workflow run on the trunk (default)
    #                            # dev: the sha dev runs, once its own CI run is green (promote)
  # named deploy targets beside dev and prod — a marketing site, docs, a second app. Each shows
  # in every tick, `asf status` and `asf prod` with its deployed sha, how many relevant commits it
  # is behind and its mode (manual: a loud "MANUAL: <target> is N relevant commits behind" line),
  # and `asf prod`'s ON PROD table lists the customer-visible PRs merged but not yet on it. The
  # holds above apply to every target.
  # targets:
  #   site:
  #     mode: manual               # auto | manual (the default) | ci (its workflow deploys itself)
  #     workflow: site-deploy.yml  # what auto dispatches; its newest success is the deployed sha
  #     # input: sha
  #     # from: ci                 # ci | dev, as prod's
  #     paths: [apps/site/**]      # behind only by trunk commits touching these globs
  #     # source: vercel           # read the deployed sha from Vercel instead of the workflow:
  #     # project: my-site-prod    #   the newest READY production deployment's commit
  #     # scope: my-team
  # deprecated: `auto: true` (read as prod.mode: auto; `asf doctor` names it), and a top-level
  # `workflow:` / `input:` (read as prod's).
  # only when provider: script
  # script: tools/deploy-sha.sh

# the product's own live URL, used by the prod probe / release notes.
app_host: https://sample.example.com

# path globs whose diffs are customer-visible — used to classify a Task's blast radius.
customer_paths:
  - apps/web/**
  - apps/api/**

# per-stage age limits before an item is "stale" (asf stale). Same shape as tools/limits.json
# today; duration strings are <n><s|m|h|d>.
stage_limits:
  card_undecided: 3d
  spec-draft: 24h
  spec-review: 12h
  plan-draft: 24h
  plan-review: 12h
  plan-approved: 24h
  task_active: 45m
  pr_approved_unbatched: 10m
  bug_S1: 10m
  bug_S2: 24h
  undecided_close: 14d

# size classes: how a Task's footprint maps to a train/lane.
size_classes:
  small:
    max_files: 3
  medium:
    max_files: 10
  large:
    max_files: 30

# the approval matrix: every class of asf.approvals.CLASSES -> auto | groom | human-now.
#   auto       the factory acts
#   groom      the hook refuses; the item waits for the next groom
#   human-now  the hook refuses; the tick raises a NEEDS OPERATOR line every cycle until resolved
# An unmapped class takes its default (see `asf approvals`). Widen or narrow here, nowhere else.
approvals:
  spend_money: human-now
  touch_production: human-now
  touch_security: human-now
  touch_customer_data: human-now
  touch_legal: human-now
  new_epic: human-now
  merge_amendable_set: human-now
  merge_routine_pr: auto
  file_bug: auto
  decide_feature: human-now   # auto: the groom decides an undecided Feature under a live Epic
  decide_bug: human-now       # auto: the same for an undecided Bug
  # two switches, not classes, both off unless set:
  # groom: auto      # the groom's policy pass, adjudicate sessions and daily digest
  # upgrade: auto    # the tick runs `asf upgrade` itself (only for ASF's own repo as a product)

# approval_signals: product-specific recognisers added to a class's built-ins (never removed) —
# a class not in asf.approvals.CLASSES, or a key other than paths/commands, is a config error.
# approval_signals:
#   spend_money:
#     commands: ['\bgh api\b.*\bbilling\b']
#   touch_customer_data:
#     paths: ['data/customers/*']
#     commands: ['\bpsql\b.*\bprod\b']

# F-0085/D-0049: the four policies' thresholds. A policy whose key is absent uses the default
# shown. Read only when approvals.groom is auto.
groom:
  duplicate_overlap: 0.95      # close_exact_duplicate: title overlap at or above this
  recurring_bug_count: 2       # decide_recurring_bug: auto-filed Bug seen this many times
  adjudicate_attempts: 2       # D8: groom sessions per groom date before the operator is asked
  adjudicate_per_day: 6        # sessions per groom date in all, counting those for questions asked since the last
  policies:                    # a policy named here with `off` never runs
    close_exact_duplicate: on

# steps: who owns each tick step (record, health, wave, prs, harvest, batch, daily).
#   asf        the default for every step ASF implements
#   <command>  run by the tick in repo_dir, with ASF_PRODUCT and ASF_CAPACITY_* in its environment
#   off        skipped (another job runs it)
# batch (an optional merge-queue script of the product's own) has no ASF implementation and must
# be declared; declaring it as a command makes the default landing pull-request.
steps:
  batch: off
  # batch: "bash tools/merge-queue.sh"

# clocks: each entry is one job labelled <prefix>.<product>.<name>.
# Every entry needs steps: [..] or shadow: true,
# and exactly one of every: <n><s|m|h|d> (at least 60s) or at: "HH:MM" (local time).
# every_n: {<name>: <n>} runs a deferrable part on every n-th tick of that clock only, over
# config.yaml's tick.every_n: a record part (backfill, plan-order, file-bugs, rollup — they run
# after the wave) or a step other than record, wave and daily. Each still runs at least every
# tick.deferred_max_age_s (default 3600). The wave runs right after record (tick.wave_first).
#   record:
#     steps: [record, health, groom, wave, prs, harvest]
#     every: 5m
#     every_n: {groom: 2, backfill: 6}
clocks:
  record:
    steps: [record]
    every: 5m
  dispatch:
    steps: [health, groom, wave, prs, harvest, batch]
    every: 10m
  daily:
    steps: [daily]
    at: "06:50"
  shadow:
    shadow: true
    every: 30m

# Optional: the release-readiness gate (`asf release-readiness`, and the Release row of `asf status`
# for the factory's own product). Every key is optional; the defaults are shown. The factory's own
# source is gated as a framework release: every criterion applies. Any other product is gated as
# a product: install, upgrade, genericity, docs and blocking apply only when configured here
# (requires.<key>, ci_steps.<step>, min_upgrades, readme_sections, blocking), self-tuning only with
# tune.enabled, release notes only with conventions.version.changelog — each reads n/a otherwise.
# release:
#   window_days: 7                 # stability and upgrade window
#   max_hand_fixes: off            # fix/hotfix/revert commits no factory session made, plus hand
#                                  # installs; off (n/a) unless set — a developer's hand commit is
#                                  # normal. The factory's own product file sets 0.
#   max_repair_per_feature: 3      # repair sessions per landed Feature over the window
#   ci_runs: 10                    # the last N finished trunk runs must all be green
#   min_upgrades: 3                # auto-upgrades in the window, none failed, torn or rolled back
#   hand_types: [fix, hotfix, revert]
#   readme_sections: [Install, Quick start, Configuration, Upgrade]
#   ci_steps: {install_from_zero: 'asf install, zero to green', generic: check generic, second_product: sample product,
#              rehearsal: release rehearsal}
#   requires: {install: [], upgrade: [], generic: [], docs: [], rehearsal: []}   # Features each criterion also needs landed
#   blocking: []                   # Features that must be landed before a release
#   floor:                         # criterion 9: no leftover older than its deadline; `off` disables a kind
#     stale_pr_days: 3             # an open PR the lane marks STALE
#     run_min: 30                  # a CI run still queued/running whose branch is gone or whose PR is closed
#     heartbeat_factor: 2          # a live cloud run silent this many heartbeats
#     stage_factor: 3              # a Task in one stage this many times its stage_limits value
#     branches: on                 # a remote head past its retention (branch_retention), awaiting delete
#   seats:                         # criterion 10, and the seat-utilisation alarm of `asf scorecard` and the tick
#     min_pct: 60                  # busy seats / available (local share + cloud max) below this …
#     idle_min: 30                 # … for this many minutes while the wave had launchable rows is red
#     max_gap_min: 15              # a gap between two tick readings longer than this ends a stretch
#   gate: 1.0                      # the gate `asf release-readiness` prints: 1.0 (every criterion above)
#                                  # or preview (asf.release_preview's five); `--gate` overrides it once
#   preview:                       # the preview gate's own files and look-back
#     notes: docs/RELEASE-NOTES.md        # release notes on the trunk
#     known_issues: docs/KNOWN-ISSUES.md  # needs a `## ` section; `asf release-readiness --known-issues` writes it
#     defect_severities: [S1, S2]         # the open Bugs that page lists
#     lookback_runs: 50                   # finished trunk runs a CI step is looked for in
#   feedback: github-issues        # or {kind: url, url: <link>}; github-issues needs a template under
#                                  # .github/ISSUE_TEMPLATE/ and repo_slug; either needs a README "Feedback" heading
#   # preview's CI steps, matched by name in ci_steps (defaults shown):
#   #   install_linux: 'install from zero, linux container'   install_macos: 'install from zero, macos fresh home'
#   #   minimal_product: 'a minimal product, end to end'      readme_first_user: 'readme-only first-user run'
#   #   generic: 'check generic'                               privacy: 'privacy sweep'
# A kind or a metric the product has no lane for (no forge, no cloud, no merge queue, no
# self-hosted runner, no quota reader, no price) reads n/a, never red. `floor:`, `seats:`, `gate:`,
# `preview:` and `feedback:` are read, but `asf doctor`'s product row names them as unknown keys while an older pinned reader
# (tools/pinned-readers.txt) is still in use.

# Optional: the throughput metrics' alarms (`asf scorecard`'s Throughput table, asf.metrics.throughput).
# The seat alarm reads release.seats above; every other key is a limit, `off` (or absent, where
# the default is off) for no alarm. Defaults shown.
# improve:
#   scorecard:
#     throughput:
#       false_close_max: 0          # reopened / landed in the window, a fraction
#       first_pass_min: 0.9         # PRs green on the first CI run, over the last first_pass_window PRs
#       first_pass_window: 50       # … the PRs it is measured over (also release criterion 12)
#       runner_reds_max: 0          # runner-class reds (runner loss, OOM, timeout) allowed …
#       runner_reds_window: 100     # … in the last this many CI runs
#       trunk_green_window: 20      # the last this many trunk runs of the required check: all green
#       reds_window: 100            # visible reds (asf status `CI reds`) over the last this many PR runs
#       check_patterns: [check, dco, sign-off, signoff, rules, notes, conventions, lint, format]
#                                   # a failed job/step naming one of these is a deterministic check
#       infra_steps: [set up job, out of memory, oom, no space left, lost communication, runner]
#                                   # a failed step naming one of these is the runner's, not the code's
#       own_cancel_causes: ['*', superseded]
#                                   # cancel-ledger causes that count as ASF's own cancel ("ours");
#                                   # '*' is any claim, 'superseded' a run a newer run replaced
#       tooling_min_prs: 3          # a failed step red on this many PRs, green only on newer ones, …
#       tooling_window_h: 24        # … within this many hours: tooling not on the branch
#       tooling_max_older_share: 0.1  # … when at most this share of the green PRs is based older
#       detect_p90_max_min: off     # watchdog time-to-detect p90, minutes
#       merge_wait_p90_max_min: off # PR green → landed p90, minutes
#       runner_queue_p90_max_min: off  # CI queue wait p90 of any runner class, minutes
#       cloud_dead_max: off         # the cloud lane's dead + timeout rate, a fraction
#       quota_cap_hours_min: 1      # an account projected to reach its 5-hour stop sooner alarms
#       quota_window_min: 60        # the quota readings the burn rate is taken over
