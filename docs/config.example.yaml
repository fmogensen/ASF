# ~/.ASF/config.yaml — the operator's shared configuration. Copy this file there and edit.
# One file, not per product: the scheduler, the worker pool and quota guards are shared; a
# product's own conventions live in ~/.ASF/products/<name>.yaml (see docs/products.example.yaml).

# Which product `asf <command>` targets when --product is not given.
default_product: sample

# scheduler: cron | launchd | systemd | gh-actions | claude-routines
# what runs, and when, is not here — it's each product's own clocks: block
# (products/<name>.yaml, see docs/products.example.yaml).
scheduler:
  provider: cron
  # the one job every provider's adapter installs
  job: asf tick

# worker pool: the accounts or API keys a spawn can use, and how much of the pool each product
# gets. A launch is always tagged with the product it runs for, so cost per product is a sum
# and a product can be given a floor/ceiling share.
worker_pool:
  backend: claude-code   # claude-code | api-key
  accounts:
    - name: acct-a
      share: 0.5
    - name: acct-b
      share: 0.5

# quota band (percent of each window, not a fraction). An account at or above `cooldown` in any
# window takes one job at a time; at or above `stop` it takes none. Running sessions are never
# stopped — the band gates new launches only. The older `worker_pool.quota_guard: {max_5h, max_7d}`
# is still read, as the `stop` for those two windows.
quota_guards:
  stop:     {five_h: 95, seven_d: 95, seven_d_model: 95}
  cooldown: {five_h: 90, seven_d: 90, seven_d_model: 90}

# capacity: the ceilings the factory runs under. Every number is "at most this many at once".
# A key left out means "no opinion" — the next fallback applies (see docs/specs/f-0079.md).
# feeder.capacity and worker_pool.reserve_for_s1 are still read, but this block is their new home.
capacity:
  total:              # across every product under ~/.ASF/products/
    sessions: 6       # concurrent worker sessions
    ci: 4             # concurrent CI runs
  per_product:        # the default for a product whose own file declares none
    sessions: 2
    ci: 1
  reserve_for_s1:     # the lane reserve, moved from worker_pool.reserve_for_s1
    local: 1
    cloud: 1

# paths: everything under ~/.ASF the tools read/write. state is per product
# (~/.ASF/state/<product>/); logs are shared.
paths:
  home: ~/.ASF
  state_dir: ~/.ASF/state
  log_dir: ~/.ASF/logs
