# ~/.ASF/config.yaml — the operator's shared configuration. Copy this file there and edit.
# One file, not per product: the scheduler, the worker pool and quota guards are shared; a
# product's own conventions live in ~/.ASF/products/<name>.yaml (see docs/products.example.yaml).
# The operator's guide: docs/guide/.

# Which product `asf <command>` targets when --product is not given and $ASF_PRODUCT is unset.
default_product: sample

# scheduler.kind: launchd (the default: `asf scheduler install` writes and loads one job per
# clock) | cron (the lines are printed for `crontab -e`, and the install exits 3) | anything
# else (no adapter: the command each job must run is printed). `provider` is read as a synonym.
# What runs, and when, is not here — it's each product's own clocks: block
# (products/<name>.yaml, see docs/products.example.yaml).
scheduler:
  kind: launchd
  # label_prefix: asf              # jobs are labelled <label_prefix>.<product>.<clock>
  # launchd_label: old.job.label   # a pre-ASF job the doctor reports until it is retired
  # legacy_labels: [old.job.*]     # pre-ASF jobs listed in the doctor's SCHEDULER section
  # legacy_cron: /opt/old/tick      # a pre-ASF crontab line (substring); doctor is red while present

# legacy_paths: directories of pre-ASF tools, for the doctor's one-factory check and cutover.
# legacy_paths: [~/old-factory/bin]

# worker pool: the accounts a spawn can use. An account's `cap` is its concurrent sessions across
# every product on this machine; `role` is its lane (local | cloud); `config_dir` is the runtime's
# isolated config dir for that account. A session runs in a HOME of its own (never the
# operator's), so it finds no login there: `auth_env` hands it its credentials explicitly, each
# variable read from a file at spawn (see guide/operating.md, Safety). A launch is always tagged
# with the product it runs for, so cost per product is a sum.
worker_pool:
  backend: claude-code   # claude-code | fake
  # brief labels → the model ids this pool may launch. An unmapped label is refused, except
  # `cheap`, which falls back to `light` (F-0093 D2) — a pool configured before the cheap tier
  # keeps running, at the price it already paid.
  models:
    heavy: <your judgement model>
    light: <your coding model>
    cheap: <your smallest model>
  # Measured 2026-09-23 over ASF's own build, as minutes of session time per landing:
  #
  # | kind       | model  | runs | hours | landed | min/landing |
  # | ---        | ---    | ---  | ---   | ---    | ---         |
  # | plan       | opus   | 11   | 5.8   | 11     | 32          |
  # | correct    | sonnet | 39   | 19.7  | 16     | 74          |
  # | fix-bug    | sonnet | 49   | 53.8  | 36     | 90          |
  # | adjudicate | opus   | 35   | 24.1  | 16     | 90          |
  # | coder      | sonnet | 38   | 52.2  | 19     | 165         |
  # | spec       | opus   | 45   | 39.9  | 12     | 200         |
  #
  # The labels are mostly right and the counts are wrong: `spec`'s cost is the 45 runs behind 12
  # landings, not the model. The pool had no tier below `light`, so a rebase, a close and the
  # groom's clerical pass paid for judgement they never used.
  # Re-read this weekly: `asf improve` recomputes the table above in `<record>/improve/<date>.md`.
  accounts:
    - name: acct-a
      role: local
      cap: 2
      config_dir: ~/.ASF/accounts/acct-a
      # auth_env:                          # VARIABLE: file — its content is that variable in this
      #                                    # account's sessions only; a missing file refuses the launch
      #   CLAUDE_CODE_OAUTH_TOKEN: ~/.ASF/secrets/acct-a.token   # `claude setup-token`, once
      #   GH_TOKEN: ~/.ASF/secrets/acct-a.gh                     # git push over HTTPS + gh
    - name: acct-b
      role: local
      cap: 2
      config_dir: ~/.ASF/accounts/acct-b
      # caps:                              # optional per-model ceiling
      #   heavy: 1
      # home: ~/.ASF/accounts/acct-b/home   # the session's HOME, a path (unset: one of its own under the state dir)
      # isolate_home: true                  # false: the session keeps the operator's HOME (default true)
      # home_seed: [~/.gitconfig]           # paths copied into the account's own home
  # worktree_buffer: 2                    # worker worktrees kept beyond the live sessions' own: an
  #                                      # ended run's clean, pushed worktree is removed by the tick
  #                                      # (branch kept); ones a queued correction reuses stay
  #                                      # within this many, least recently used out first
  # env_passthrough: [HTTPS_PROXY]         # variable names a worker session keeps from the tick's environment
  # quota_command: bin/quota {account}     # one JSON line: {"five_h_pct", "seven_d_pct",
  #                                        # "seven_d_model_pct"}; without it no band applies
  # settings_file: ~/.ASF/worker-settings.json   # runtime settings every session starts with
  # sessions: process           # process | command | fake — how the pool observes running sessions
  # sessions_command: bin/sessions   # prints one JSON object per session: {"pid", "ppid", "env"}
  # session_match: '^(\S*/)?claude(\s|$)'   # default: the runtime binary as argv[0]

# quota band (percent of each window, not a fraction). An account at or above `cooldown` in any
# window takes one job at a time; at or above `stop` it takes none. Running sessions are never
# stopped — the band gates new launches only. The bands read worker_pool.quota_command. The older
# `worker_pool.quota_guard: {max_5h, max_7d}` is still read, as the `stop` for those two windows.
# Block maps only: the config reader does not parse inline {a: 1} maps.
quota_guards:
  stop:
    five_h: 95
    seven_d: 95
    seven_d_model: 95
  cooldown:
    five_h: 90
    seven_d: 90
    seven_d_model: 90

# account_lock: an account manager's global usage lock, named so a wedged one is reported (status
# Quota row, doctor `quota lock` row) and, opt-in, reclaimed by the tick. Unset = off: nothing is
# probed. See guide/product-config.md, "A wedged usage lock".
# account_lock:
#   path: ~/.<manager>/.lock               # the lock file
#   process: <manager>                     # its program name; reclaim signals nothing without it
#   refresh_command: <manager> usage refresh   # run once after a reclaim
#   reclaim: true                          # default false (older spelling: quota_guards.reclaim_cux_lock)

# host guard: the tick starts no new session and no landing gate while this host is loaded — the
# 15-minute load average at or over `load_per_core` × cores, or swap in use at or over `swap_pct`
# percent. The wave then prints `waits <job> <item> — held: host pressure load <n>/cores <c>,
# swap <p>%` per row and `wave: held: …`; the harvest prints `harvest: held: host pressure …` and
# each branch waits at `host-pressure`, re-gated next tick (never red). Running sessions are never
# stopped. Defaults when the key is absent: 2.0 and 85. A value of 0 turns that guard off.
host_guards:
  load_per_core: 2.0
  swap_pct: 85

# cloud: the cloud lane (asf.workers.cloud). A row the local lane cannot take — no local seat, or
# host pressure — runs off this host instead. Runtime `actions` (asf.workers.actions) dispatches
# the product's asf-worker workflow on `runs_on`: the job checks the branch out, runs the session,
# builds, tests, commits and pushes, and harvest lands it as any branch. `asf cloud install
# --product <p>` writes the workflow into the product checkout (commit it to the default branch);
# the repo secret `token_secret` holds the cloud-lane account's own token. A product file's own
# `cloud:` overrides these keys one by one. `asf doctor` shows a `cloud lane` row set; `asf cloud
# doctor --product <p>` prints each readiness check of the lane as ok or gap.
#
# Runtime `claude-remote` (asf.workers.remote) runs the session as a claude.ai routine instead —
# no repo secret: a small local `claude -p` (helper_model) calls the CLI's RemoteTrigger tool on
# the dispatching account's own login (its config_dir; the auth_env setup-token lacks the scope)
# to create the routine (a short pointer to the brief, which ASF pushes to origin's
# refs/asf/briefs/<job> and deletes when the run ends; the product repo as its source) and fire
# it. Each helper call is killed after 120s (the launch fails `timeout`). A cloud
# environment belongs to one account: `environment_id` is one env_… id or {account: env_…}.
#   runtime: claude-remote
#   environment_id: {acct-a: env_…}
#   model: claude-opus-5       # optional: default the row's model
#   allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
#   helper_model: haiku
#   poll_min: 15               # how often a working run's routine is read
#   max_creates_per_tick: 2    # cloud launches one wave tries (claude-remote default 2; 0: no limit)
#
# The runtime `claude-cloud` is refused at config check: the runtime CLI cannot create a cloud
# session non-interactively (`-p --cloud` is interactive only), so a lane on it could never launch.
# workers: the heartbeat every worker session keeps, whatever runs it (local, actions,
# claude-remote). The brief starts a background loop that pushes the session's work in progress
# and its NOTES.asf.md to refs/asf/hb/<job> every heartbeat_min minutes; each tick reads every
# run's branch and beat ref with one `git ls-remote`. A run that has not moved for
# heartbeat_min x heartbeat_missed minutes (after heartbeat_grace_min of setup) is stalled: it is
# stopped, ended dead, and continued in the same tick by a new session from its branch head,
# its notes and a summary of its last events. heartbeat_resumes caps the continuations of one
# chain (0: end it dead, no continuation). The lane's own limit (cloud.timeout_min) stays the
# backstop. The `cloud:` block's heartbeat_* keys (the operator's, or a product file's)
# override them for cloud-lane runs.
workers:
  heartbeat_min: 5
  heartbeat_missed: 2
  heartbeat_grace_min: 10
  heartbeat_resumes: 2

cloud:
  enabled: false
  runtime: actions
  runs_on: [ubuntu-latest]     # the job's labels, e.g. [self-hosted, linux]
  token_secret: CLAUDE_CODE_OAUTH_TOKEN   # the repo secret the job authenticates with
  max_inflight: 4              # cloud sessions at once (else worker_pool.caps.cloud_max_inflight)
  rows: cloud-ok               # or `any`: which rows may go to the lane
  # accounts: [acct-a]         # whose quota they spend; unset = the role: cloud accounts
  timeout_min: 240             # a run still working after this is cancelled, and ends dead
                               # (the backstop: the heartbeat above ends a stalled run sooner)
  # heartbeat_min: 5           # the lane's own heartbeat_* keys override workers: for cloud runs
  # mode: overflow (default; alias local) — local first; primary — the cloud first (below);
  # off — no new cloud launch, live runs drain. `default: true` is the older spelling of primary.
  # In primary a row goes local only when it must (local_only) or as the fallback: the lane full,
  # unready, out of quota, or erroring (fallback_failures creates failed in fallback_window_min
  # → fallback_cooldown_min local); each fallback is a `— cloud fallback: <why>` launch line.
  mode: overflow
  # fallback_failures: 3
  # fallback_window_min: 30
  # fallback_cooldown_min: 30
  # default: the cloud as the DEFAULT executor instead of overflow. true: a row of kind coder,
  # correct, review, adjudicate, fix-bug, spec, plan, direct or groom (every kind with
  # `rows: any`; a cloud-ok row too) goes to the cloud FIRST, up to max_inflight; the local lane
  # takes rows that are local-only, and every row while the cloud lane is full or unready. Host
  # pressure then holds local rows only — a cloud row runs nothing here, bounded by max_inflight
  # and its account's quota; the fair share bounds both lanes (a cloud session is a live one).
  # The lane is unready — the wave says `cloud lane unready: <why> — local lane only` — while a
  # critical check of `asf cloud doctor --product <p>` fails (the token secret's name in the repo,
  # the workflow on the trunk, an online runner carrying runs_on, a cloud account).
  # local_only: [groom]        # kinds that never leave the host; a card's own `local_only: true`
                               # keeps that item's rows local too (both modes)

# capacity: the ceilings the factory runs under. Every number is "at most this many at once".
# A key left out means "no opinion" — the next fallback applies (see docs/guide/product-config.md).
# feeder.capacity and worker_pool.reserve_for_s1 are still read, but this block is their new home.
capacity:
  total:              # across every product under ~/.ASF/products/
    sessions: 6       # concurrent worker sessions
    ci: 4             # concurrent CI runs
  per_product:        # the default for a product whose own file declares none
    sessions: 2
    ci: 1
  reserve_for_s1:     # the lane reserve, moved from worker_pool.reserve_for_s1
    local: 1
    cloud: 1

# tune: the self-tuning loop (asf.tune). Per session kind named under `bounds`, the wave tries one
# step at a time — the next cheaper model of `models` (labels of worker_pool.models, most capable
# first), or one seat more or fewer within `seats: [min, max]` — measured off the session
# registry: repair rounds per landed item, failure rate, landed share, spend per landed item.
# After `trial_samples` runs it keeps the step when landed items per unit of spend rose by
# `min_gain` at repair no worse than before, and reverts it when repair or the failure rate
# worsened by more than `max_regress` (or the gain did not come). Never outside the bounds, one
# live trial per kind, S1 rows untouched. `asf tune freeze` reverts every live trial and starts
# none; `asf tune history` lists every change with its reason and numbers. Off by default; a
# product turns it on under `products.<name>`. ASF's own install tunes itself like this:
# tune:
#   enabled: false            # the default for every product
#   window_days: 7            # the rolling window the signal is read over
#   min_samples: 10           # a kind's runs since its last change before a trial starts
#   trial_samples: 10         # a trial's runs before it is judged
#   min_gain: 0.10            # the objective's rise a trial must show to be kept
#   max_regress: 0.10         # the rise in repair or failure rate that reverts it
#   bounds:
#     review:
#       models: [heavy, light]
#       seats: [1, 3]
#     coder:
#       models: [light, cheap]
#   products:
#     asf:
#       enabled: true

# tick: a command step (a product's `steps: {<step>: "<command>"}`) is killed after this many
# seconds and exits 124 (default 900).
# wave_first: the wave runs right after the record's fast parts (ingest, plan-tasks, replan,
# slice, index); health, groom and the record's tail (backfill, plan-order, file-bugs, rollup)
# run after it (default true). The span tick start → wave start is the dwell watchdog's
# wave_latency (conventions.watchdog.wave_latency, default 2 min).
# every_n: every product's cadence for the deferrable parts — a record tail part or a step other
# than record, wave and daily runs on every n-th tick (a clock's own every_n overrides it;
# defaults shown, anything unnamed every tick).
# deferred_max_age_s: a deferred part whose last run is older than this runs on the next tick
# whatever its every_n (default 3600: at least hourly).
# tick:
#   step_timeout_s: 900
#   wave_first: true
#   every_n: {backfill: 3, plan-order: 3, file-bugs: 3, rollup: 3}
#   deferred_max_age_s: 3600

# factory: the identity the tick's state commits are authored as (default "ASF <asf@localhost>").
# factory:
#   git_identity: "ASF <asf@localhost>"

# upgrade: after the tick's auto-upgrade installs, the next waits this many minutes so one
# install carries several commits (default 30). A commit with an `Urgent: yes` trailer skips it.
# drain_wait_s: how long the upgrading tick waits at its start for the other asf ticks and
# background harvests to end before it defers the install to its next start (default 180).
# upgrade:
#   min_interval_min: 30
#   drain_wait_s: 180

# operator.path_prefix: directories (`:`-joined) searched before the inherited PATH when the
# release rollup runs `gh` — for a host whose scheduler jobs get a minimal PATH. Default: unset,
# the inherited PATH alone.
# operator:
#   path_prefix: /usr/local/bin

# connectors: which implementation each external concern uses (docs/guide/writing-a-connector.md).
# Unset, each kind keeps today's behaviour. A value is a name — in-tree, or a Python entry point
# published under `asf.connectors.<kind>` — or a block map with `command:` (the command form: a
# shell command with a JSON contract). An older key that already chose still counts:
# worker_pool.quota_command is the quota command form.
# connectors:
#   forge: github                  # github (default) | fake | command | <entry point>
#   quota: none                    # none (default: every account available) | command | fake
#   secrets: file                  # file (default: auth_env names files) | command
#   # secrets:                     # the command form: {ref} is the auth_env reference
#   #   command: my-vault read {ref}
#   #   timeout_s: 30

# Everything ASF reads and writes lives under ~/.ASF: products/, state/<product>/ (the session
# ledger, the worktrees, the tick's record clone), logs/. Set $ASF_HOME to move all of it.
