# ~/.ASF/config.yaml — the operator's shared configuration. Copy this file there and edit.
# One file, not per product: the scheduler, the worker pool and quota guards are shared; a
# product's own conventions live in ~/.ASF/products/<name>.yaml (see docs/products.example.yaml).
# The operator's guide: docs/guide/.

# Which product `asf <command>` targets when --product is not given and $ASF_PRODUCT is unset.
default_product: sample

# scheduler.kind: launchd (the default: `asf scheduler install` writes and loads one job per
# clock) | systemd (Linux: one user .service + .timer per clock, enabled with `systemctl --user`)
# | cron (the lines are printed for `crontab -e`, and the install exits 3) | anything
# else (no adapter: the command each job must run is printed). `provider` is read as a synonym;
# `connectors.scheduler` (below), when set, wins over both.
# What runs, and when, is not here — it's each product's own clocks: block
# (products/<name>.yaml, see docs/products.example.yaml).
scheduler:
  kind: launchd
  # label_prefix: asf              # jobs are labelled <label_prefix>.<product>.<clock>
  # launchd_label: old.job.label   # a pre-ASF job the doctor reports until it is retired
  # legacy_labels: [old.job.*]     # pre-ASF jobs listed in the doctor's SCHEDULER section
  # legacy_cron: /opt/old/tick      # a pre-ASF crontab line (substring); doctor is red while present
  # systemd_unit_dir: ~/.config/systemd/user   # where kind systemd writes its units (this default)
  # provider: launchd              # the older synonym of kind
  # occupancy: ...                 # registered, read by no code of this release
  # interval_s: 600                # no longer read: clocks live in the product file (doctor says so)
  # min_every_s: 60                # the shortest clock interval accepted
  # queue_every_s: 60              # the CI queue clock's interval

# schema_version: 1                # the config file's shape version (written by `asf init`)
# legacy_steps: [old.job.label]    # tools/cutover.sh: pre-ASF jobs the cutover excuses
# cutover:
#   job_timeout_s: 90              # tools/cutover.sh: how long gate 3 waits for a record run

# legacy_paths: directories of pre-ASF tools, for the doctor's one-factory check and cutover.
# legacy_paths: [~/old-factory/bin]

# worker pool: the accounts a spawn can use. An account's `cap` is its concurrent sessions across
# every product on this machine; `role` is its lane (local | cloud); `config_dir` is the runtime's
# isolated config dir for that account. A session runs in a HOME of its own (never the
# operator's), so it finds no login there: `auth_env` hands it its credentials explicitly, each
# variable read from a file at spawn (see guide/operating.md, Safety). A launch is always tagged
# with the product it runs for, so cost per product is a sum.
worker_pool:
  backend: claude-code   # claude-code | fake
  # brief labels → the model ids this pool may launch. An unmapped label is refused, except
  # `cheap`, which falls back to `light` (F-0093 D2) — a pool configured before the cheap tier
  # keeps running, at the price it already paid.
  models:
    heavy: <your judgement model>
    light: <your coding model>
    cheap: <your smallest model>
  # Measured 2026-09-23 over ASF's own build, as minutes of session time per landing:
  #
  # | kind       | model  | runs | hours | landed | min/landing |
  # | ---        | ---    | ---  | ---   | ---    | ---         |
  # | plan       | opus   | 11   | 5.8   | 11     | 32          |
  # | correct    | sonnet | 39   | 19.7  | 16     | 74          |
  # | fix-bug    | sonnet | 49   | 53.8  | 36     | 90          |
  # | adjudicate | opus   | 35   | 24.1  | 16     | 90          |
  # | coder      | sonnet | 38   | 52.2  | 19     | 165         |
  # | spec       | opus   | 45   | 39.9  | 12     | 200         |
  #
  # The labels are mostly right and the counts are wrong: `spec`'s cost is the 45 runs behind 12
  # landings, not the model. The pool had no tier below `light`, so a rebase, a close and the
  # groom's clerical pass paid for judgement they never used.
  # Re-read this weekly: `asf improve` recomputes the table above in `<record>/improve/<date>.md`.
  accounts:
    - name: acct-a
      role: local
      cap: 2
      config_dir: ~/.ASF/accounts/acct-a
      # auth_env:                          # VARIABLE: file — its content is that variable in this
      #                                    # account's sessions only; a missing file refuses the launch
      #   CLAUDE_CODE_OAUTH_TOKEN: ~/.ASF/secrets/acct-a.token   # `claude setup-token`, once
      #   GH_TOKEN: ~/.ASF/secrets/acct-a.gh                     # git push over HTTPS + gh
    - name: acct-b
      role: local
      cap: 2
      config_dir: ~/.ASF/accounts/acct-b
      # caps:                              # optional per-model ceiling
      #   heavy: 1
      # home: ~/.ASF/accounts/acct-b/home   # the session's HOME, a path (unset: one of its own under the state dir)
      # isolate_home: true                  # false: the session keeps the operator's HOME (default true)
      # home_seed: [~/.gitconfig]           # paths copied into the account's own home
  # worktree_buffer: 2                    # worker worktrees kept beyond the live sessions' own: an
  #                                      # ended run's clean, pushed worktree is removed by the tick
  #                                      # (branch kept); ones a queued correction reuses stay
  #                                      # within this many, least recently used out first
  # env_passthrough: [HTTPS_PROXY]         # variable names a worker session keeps from the tick's environment
  # quota_command: bin/quota {account}     # one JSON line: {"five_h_pct", "seven_d_pct",
  #                                        # "seven_d_model_pct"}; without it no band applies
  # settings_file: ~/.ASF/worker-settings.json   # runtime settings every session starts with
  # sessions: process           # process | command | fake — how the pool observes running sessions
  # sessions_command: bin/sessions   # prints one JSON object per session: {"pid", "ppid", "env"}
  # session_match: '^(\S*/)?claude(\s|$)'   # default: the runtime binary as argv[0]
  # auth_error_patterns:                 # regexes (ignoring case) for a launch the provider refused
  #   - 'oauth_org_not_allowed'           # for the account; one match takes the account out of the
  #   - 'subscription (has been )?disabled'   # pool at once, raises one ALARM and relaunches the
  #                                       # item elsewhere (or it waits, with one account), until
  #                                       # `asf workers enable <account>`. Unset: generic defaults
  #                                       # (401/403 unauthorized/forbidden, invalid api key, org
  #                                       # not allowed, subscription/account disabled)
  # binary: claude                       # the runtime CLI a session runs (default claude)
  # permission_mode: <mode>              # the runtime's permission mode for every session (default: unset)
  # fake_script: ~/bin/fake-session      # backend fake: the script a fake session runs
  # launch_concurrency: 4                # launches one wave starts at once (1: one at a time)
  # id_range_prefixes: [S, T, B]         # the record id prefixes a session may mint ...
  # id_range_start: 5000                 # ... from this number up ...
  # id_range_size: 50                    # ... in blocks of this many per session
  # progress_sampler: false              # false turns the session progress sampler off (default on)
  # env:                                 # variables every local worker session gets (default none:
  #   JOBS: '2'                          # a test runner's pool size is a product's conventions.worker_env)
  # worktree_setup_timeout_s: 900        # conventions.worktree_setup is killed after this (s)
  # model_fallback:                      # a brief label with no model falls back to this label
  #   cheap: light
  # orphan_grace_s: 1800                 # an unrecorded worktree this old is reclaimed (spawn: 1800,
  #                                      # the reaper: 3600 when unset)
  # stop_grace_s: 10                     # SIGTERM to SIGKILL when a run is stopped
  # progress:                            # the session progress sampler
  #   sample_every_s: 60
  #   window_min: 10                     # the window "tool classes lately" is read over
  #   keep_days: 7                       # a progress file untouched this long is swept
  #   watch_max_h: 24                    # a sampler never outlives this
  # seats:                               # the machine's seat ledger
  #   claim_ttl_s: 1800                  # a claim no launch caught up with expires
  #   lock_wait_s: 5
  # caps:                                # how often one item may go round before it parks
  #   relaunch: 2                        # launches of one job on an unchanged head and card
  #   empty: 2                           # ends that wrote nothing
  #   incomplete: 2                      # resumed deliveries leaving the same Tasks unbuilt
  #   same_head_loop: 3                  # runs of one kind all handed the same head
  #   hook_refusal: 2                    # holds in a row on the same hook refusal
  # accounts[].note — note: free text on an account for the operator; nothing reads it

# quota band (percent of each window, not a fraction). An account at or above `cooldown` in any
# window takes one job at a time; at or above `stop` it takes none. Running sessions are never
# stopped — the band gates new launches only. The bands read worker_pool.quota_command. The older
# `worker_pool.quota_guard: {max_5h, max_7d}` is still read, as the `stop` for those two windows.
# Block maps only: the config reader does not parse inline {a: 1} maps.
quota_guards:
  stop:
    five_h: 95
    seven_d: 95
    seven_d_model: 95
  cooldown:
    five_h: 90
    seven_d: 90
    seven_d_model: 90
  # seven_d_cooldown: 90         # the older flat spelling of cooldown.seven_d
  # stale_after_min: 30          # a quota reading older than this is stale
  # five_h_usd: 40               # dollars of one full 5h window (unset: estimated from history)
  # running_allowance: 0.5       # the share of its estimate a running session still holds
  # min_runs: 3                  # runs of one (kind, family) before history replaces default_cost
  # model_families: [opus, sonnet, haiku]   # names a model id contains, matched in this order
  # default_cost:                # percent of a 5h window one launch spends, per family and kind
  #   opus:                      # (`*`: any other kind / family; every row needs a `*`)
  #     spec: 10
  #     '*': 8
  #   sonnet:
  #     '*': 4
  #   haiku:
  #     '*': 1
  #   '*':
  #     '*': 6

# account_lock: an account manager's global usage lock, named so a wedged one is reported (status
# Quota row, doctor `quota lock` row) and, opt-in, reclaimed by the tick. Unset = off: nothing is
# probed. See guide/product-config.md, "A wedged usage lock".
# account_lock:
#   path: ~/.<manager>/.lock               # the lock file
#   process: <manager>                     # its program name; reclaim signals nothing without it
#   refresh_command: <manager> usage refresh   # run once after a reclaim
#   reclaim: true                          # default false (older spelling: quota_guards.reclaim_cux_lock)

# host guard: the tick starts no new session and no landing gate while this host is loaded — the
# 15-minute load average at or over `load_per_core` × cores, or swap in use at or over `swap_pct`
# percent. The wave then prints `waits <job> <item> — held: host pressure load <n>/cores <c>,
# swap <p>%` per row and `wave: held: …`; the harvest prints `harvest: held: host pressure …` and
# each branch waits at `host-pressure`, re-gated next tick (never red). Running sessions are never
# stopped. Defaults when the key is absent: 2.0 and 85. A value of 0 turns that guard off.
host_guards:
  load_per_core: 2.0
  swap_pct: 85

# cloud: the cloud lane (asf.workers.cloud). A row the local lane cannot take — no local seat, or
# host pressure — runs off this host instead. Runtime `actions` (asf.workers.actions) dispatches
# the product's asf-worker workflow on `runs_on`: the job checks the branch out, runs the session,
# builds, tests, commits and pushes, and harvest lands it as any branch. `asf cloud install
# --product <p>` writes the workflow into the product checkout (commit it to the default branch);
# the repo secret `token_secret` holds the cloud-lane account's own token. A product file's own
# `cloud:` overrides these keys one by one. `asf doctor` shows a `cloud lane` row set; `asf cloud
# doctor --product <p>` prints each readiness check of the lane as ok or gap.
#
# Runtime `claude-remote` (asf.workers.remote) runs the session as a claude.ai routine instead —
# no repo secret: a small local `claude -p` (helper_model) calls the CLI's RemoteTrigger tool on
# the dispatching account's own login (its config_dir; the auth_env setup-token lacks the scope)
# to create the routine (a short pointer to the brief, which ASF pushes to origin's
# refs/asf/briefs/<job> and deletes when the run ends; the product repo as its source) and fire
# it. Each helper call is killed after 120s (the launch fails `timeout`). A cloud
# environment belongs to one account: `environment_id` is one env_… id or {account: env_…}.
#   runtime: claude-remote
#   environment_id: {acct-a: env_…}
#   model: claude-opus-5       # optional: default the row's model
#   allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
#   helper_model: haiku
#   poll_min: 15               # how often a working run's routine is read
#   max_creates_per_tick: 2    # cloud launches one wave tries (claude-remote default 2; 0: no limit)
#   helper_timeout_s: 120      # each helper call is killed after this
#
# The runtime `claude-cloud` is refused at config check: the runtime CLI cannot create a cloud
# session non-interactively (`-p --cloud` is interactive only), so a lane on it could never launch.
# workers: the heartbeat every worker session keeps, whatever runs it (local, actions,
# claude-remote). The brief starts a background loop that pushes the session's work in progress
# and its NOTES.asf.md to refs/asf/hb/<job> every heartbeat_min minutes; each tick reads every
# run's branch and beat ref with one `git ls-remote`. A run that has not moved for
# heartbeat_min x heartbeat_missed minutes (after heartbeat_grace_min of setup) is stalled: it is
# stopped, ended dead, and continued in the same tick by a new session from its branch head,
# its notes and a summary of its last events. heartbeat_resumes caps the continuations of one
# chain (0: end it dead, no continuation). The lane's own limit (cloud.timeout_min) stays the
# backstop. The `cloud:` block's heartbeat_* keys (the operator's, or a product file's)
# override them for cloud-lane runs.
workers:
  heartbeat_min: 5
  heartbeat_missed: 2
  heartbeat_grace_min: 10
  heartbeat_resumes: 2

cloud:
  enabled: false
  runtime: actions
  runs_on: [ubuntu-latest]     # the job's labels, e.g. [self-hosted, linux]
  token_secret: CLAUDE_CODE_OAUTH_TOKEN   # the repo secret the job authenticates with
  max_inflight: 4              # cloud sessions at once (else worker_pool.caps.cloud_max_inflight)
  rows: cloud-ok               # or `any`: which rows may go to the lane
  # accounts: [acct-a]         # whose quota they spend; unset = the role: cloud accounts
  timeout_min: 240             # a run still working after this is cancelled, and ends dead
                               # (the backstop: the heartbeat above ends a stalled run sooner)
  # heartbeat_min: 5           # the lane's own heartbeat_* keys override workers: for cloud runs
  # mode: overflow (default; alias local) — local first; primary — the cloud first (below);
  # off — no new cloud launch, live runs drain. `default: true` is the older spelling of primary.
  # In primary a row goes local only when it must (local_only) or as the fallback: the lane full,
  # unready, out of quota, or erroring (fallback_failures creates failed in fallback_window_min
  # → fallback_cooldown_min local); each fallback is a `— cloud fallback: <why>` launch line.
  mode: overflow
  # fallback_failures: 3
  # fallback_window_min: 30
  # fallback_cooldown_min: 30
  # default: the cloud as the DEFAULT executor instead of overflow. true: a row of kind coder,
  # correct, review, adjudicate, fix-bug, spec, plan, direct or groom (every kind with
  # `rows: any`; a cloud-ok row too) goes to the cloud FIRST, up to max_inflight; the local lane
  # takes rows that are local-only, and every row while the cloud lane is full or unready. Host
  # pressure then holds local rows only — a cloud row runs nothing here, bounded by max_inflight
  # and its account's quota; the fair share bounds both lanes (a cloud session is a live one).
  # The lane is unready — the wave says `cloud lane unready: <why> — local lane only` — while a
  # critical check of `asf cloud doctor --product <p>` fails (the token secret's name in the repo,
  # the workflow on the trunk, an online runner carrying runs_on, a cloud account).
  # workflow: asf-worker.yml   # runtime actions: the workflow file dispatched
  # launch_wait_s: 30          # how long a dispatch waits for its run to show up
  # lost_after_min: 15         # a dispatched run not listed after this never will: ended dead
  # local_only: [groom]        # kinds that never leave the host; a card's own `local_only: true`
                               # keeps that item's rows local too (both modes)

# capacity: the ceilings the factory runs under. Every number is "at most this many at once".
# A key left out means "no opinion" — the next fallback applies (see docs/guide/product-config.md).
# feeder.capacity and worker_pool.reserve_for_s1 are still read, but this block is their new home.
capacity:
  total:              # across every product under ~/.ASF/products/
    sessions: 6       # concurrent worker sessions
    ci: 4             # concurrent CI runs
  per_product:        # the default for a product whose own file declares none
    sessions: 2
    ci: 1
  reserve_for_s1:     # the lane reserve, moved from worker_pool.reserve_for_s1
    local: 1
    cloud: 1

# tune: the self-tuning loop (asf.tune). Per session kind named under `bounds`, the wave tries one
# step at a time — the next cheaper model of `models` (labels of worker_pool.models, most capable
# first), or one seat more or fewer within `seats: [min, max]` — measured off the session
# registry: repair rounds per landed item, failure rate, landed share, spend per landed item.
# `lookback_days.<kind>` holds a kind's runs out of a trial's verdict until they ended that many
# days ago, so the repair work they cause (a plan's shows up in the work built on it; a groom's or
# a replan's in the Tasks it reshaped) has had time to happen; a kind not named there judges at
# once (`plan: 7` is the built-in default). After `trial_samples` matured runs it keeps the step
# when landed items per unit of spend rose by `min_gain` at repair no worse than before, and
# reverts it when repair or the failure rate worsened by more than `max_regress` (or the gain did
# not come). Never outside the bounds, one live trial per kind, S1 rows untouched. `asf tune
# freeze` reverts every live trial and starts none; `asf tune history` lists every change with its
# reason and numbers. Off by default; a product turns it on under `products.<name>`:
# tune:
#   enabled: false            # the default for every product
#   window_days: 7            # the rolling window the signal is read over
#   min_samples: 10           # a kind's runs since its last change before a trial starts
#   trial_samples: 10         # a trial's runs before it is judged
#   min_gain: 0.10            # the objective's rise a trial must show to be kept
#   max_regress: 0.10         # the rise in repair or failure rate that reverts it
#   required: false           # release readiness counts criterion 11 (self-tuning live) even
#                             # while the loop is off; unset, it reads n/a then
#   lookback_days:
#     plan: 7                 # the built-in default; named here to show it can be overridden
#     groom: 3
#     replan: 3
#   bounds:
#     review:
#       models: [heavy, light]
#       seats: [1, 3]
#     coder:
#       models: [light, cheap]
#     plan:
#       models: [heavy, light]
#     groom:
#       models: [heavy, light]
#     replan:
#       models: [light, cheap]
#   products:
#     sample:
#       enabled: true
#       required: true

# shadow: the code decider ledger (asf.shadow). A decider that replaces a model session —
# `conventions.flags.<flag>: shadow` — runs beside it: the code's answer is logged against the
# incumbent's for EVERY decision (`asf deciders`), the count over DISTINCT cases (a repeat ask on
# the same evidence is one trial, not a second), with the one-sided error bound at `confidence`
# (95%: about `3/N` at zero diffs). `outcome_days` is how long a closing decider's "landed" answer
# waits before it is judged against what actually happened (an item reopened inside that window is
# a diff, even where the incumbent agreed). `min_n` is the distinct cases a decider needs before a
# flip is argued — one number for every decider, or a map by name. A decider that closes, removes
# or pushes is never cut over by code: the operator flips its flag by hand, only after the
# evidence.
# shadow:
#   confidence: 0.95
#   outcome_days: 7
#   min_n: 300                 # every decider's default
#   # min_n:                   # or a map, per decider:
#   #   facts: 300
#   #   mechanical: 40
#   #   roots: 100

# measure: the session-registry arithmetic (asf.improve.measure) behind `asf improve` and the
# self-tuning loop's own signal. A cloud-lane run's job log carries no local usage data
# (`total_cost_usd`), so its spend would otherwise read as unknown; `cost_estimate_min_samples` is
# how many of this call's own priced runs sharing that run's (kind, model) must exist before its
# spend is filled in as their median instead — the run then carries `usd_estimated: true`, so a
# reader can tell the measured dollars from the guessed ones. Fewer samples leaves it unknown.
# measure:
#   cost_estimate_min_samples: 3

# tick: a command step (a product's `steps: {<step>: "<command>"}`) is killed after this many
# seconds and exits 124 (default 900).
# wave_first: the wave runs right after the record's fast parts (ingest, plan-tasks, replan,
# slice, index); health, groom and the record's tail (backfill, plan-order, file-bugs, rollup)
# run after it (default true). The span tick start → wave start is the dwell watchdog's
# wave_latency (conventions.watchdog.wave_latency, default 2 min).
# every_n: every product's cadence for the deferrable parts — a record tail part or a step other
# than record, wave and daily runs on every n-th tick (a clock's own every_n overrides it;
# defaults shown, anything unnamed every tick).
# deferred_max_age_s: a deferred part whose last run is older than this runs on the next tick
# whatever its every_n (default 3600: at least hourly).
# budget_s: the tick's wall-clock budget (0: none); unset, it is `watchdog.factor` × the clock's
# interval, at least `watchdog.floor_s`, or `watchdog.default_s` for a clock with no interval.
# The locks: the daily waits `daily_lock_wait_s` for a running tick, a record part
# `record_lock_wait_s`, polling every `lock_poll_s`.
# tick:
#   step_timeout_s: 900
#   wave_first: true
#   every_n: {backfill: 3, plan-order: 3, file-bugs: 3, rollup: 3}
#   deferred_max_age_s: 3600
#   budget_s: 7200
#   daily_lock_wait_s: 2700
#   record_lock_wait_s: 600
#   lock_poll_s: 10
#   watchdog:
#     factor: 3
#     floor_s: 3600
#     default_s: 7200

# clocks.wave: the wave's own clock (asf.tick.wave_clock) — every product whose clocks carry a
# wave step also gets a short `asf wave` job, installed beside the others, that runs the launch
# path alone (read the record, plan, screen, spawn) under its own lock, never the product's tick
# lock — so a long tick's health, harvest or CI-log work never makes a ready row or a free seat
# wait for it. `every` is its interval (default 1m); `off` turns it off and leaves launches to the
# product's own tick, as before this clock existed.
# clocks:
#   wave:
#     every: 1m
# clocks:
#   wave: off

# factory: the identity the tick's state commits are authored as (default "ASF <asf@localhost>").
# factory:
#   git_identity: "ASF <asf@localhost>"

# upgrade: after the tick's auto-upgrade installs, the next waits this many minutes so one
# install carries several commits (default 30). A commit with an `Urgent: yes` trailer skips it.
# drain_wait_s: how long the upgrading tick waits at its start for the other asf ticks and
# background harvests to end before it defers the install to its next start (default 180).
# drain_marker_max_s: a move's drain marker (state/<p>/upgrade-draining.json) that records no
# deadline — written by an older build — is dropped once older than this (default 960); one
# with a deadline is dropped 60s past it.
# repo_url: where `asf upgrade` fetches from (a fork or a mirror); pending_ttl_s: how long a
# pending install waits for its gap between ticks.
# upgrade:
#   min_interval_min: 30
#   drain_wait_s: 180
#   drain_marker_max_s: 960
#   repo_url: https://github.com/fmogensen/ASF.git
#   pending_ttl_s: 600

# operator.path_prefix: directories (`:`-joined) searched before the inherited PATH when the
# release rollup runs `gh` — for a host whose scheduler jobs get a minimal PATH. Default: unset,
# the inherited PATH alone.
# tick_file / plugin_dir: tools/cutover.sh retires the pre-ASF tick procedure file and plugin dir.
# operator:
#   path_prefix: /usr/local/bin
#   tick_file: ~/old-factory/TICK.md
#   plugin_dir: ~/old-factory/plugin

# connectors: which implementation each external concern uses (docs/guide/writing-a-connector.md).
# Unset, each kind keeps today's behaviour. A value is a name — in-tree, or a Python entry point
# published under `asf.connectors.<kind>` — or a block map with `command:` (the command form: a
# shell command with a JSON contract). An older key that already chose still counts:
# worker_pool.quota_command is the quota command form.
# connectors:
#   forge: github                  # github (default) | fake | command | <entry point>
#   quota: none                    # none (default: every account available) | command | fake
#   secrets: file                  # file (default: auth_env names files) | command
#   scheduler: launchd             # launchd (default) | systemd | cron | none | fake | command
#   # secrets:                     # the command form: {ref} is the auth_env reference
#   #   command: my-vault read {ref}
#   #   timeout_s: 30

# ci_heartbeat: the self-hosted CI boxes are the product's ci.pool (each runner's `box:`); a
# heartbeat watchdog and its installer read them from `asf ci boxes --product <p>` (box=target
# lines; --missing: only boxes with no fresh heartbeat). targets: a box's ssh target (default the
# box name, an ssh alias). seen_file: {box: epoch} of the newest heartbeat the watchdog read
# (default state/ci-heartbeat/seen.json under the ASF home); `asf doctor` is red for a pool box
# with none newer than stale_min minutes (default 10). No seen file: no doctor row.
# ci_heartbeat:
#   stale_min: 10
#   seen_file: ~/.ASF/state/ci-heartbeat/seen.json
#   targets:
#     box-1: user@box-1.example

# network: the forge reachability probe (asf.tick.network). probe/recover/watchdog: on | off
# (default off); hosts: the names a probe resolves (default the forge's two hosts).
# network:
#   probe: on
#   recover: off
#   watchdog: off
#   hosts: [git.example.com]

# credentials: signed-in tools as rules (asf.credentials; docs/guide/product-config.md).
# credentials:
#   window_days: 7
#   probe_every: 1h
#   providers:
#     forge:
#       probe: forge-cli auth status
#       renew: forge-cli auth login

# Timeouts and list sizes every subprocess call takes (seconds). A large monorepo or a slow
# link needs longer git; a busy repo more than 300 open PRs (gh stops at its --limit silently).
# git:
#   timeout_s: 120            # one git call
#   fetch_timeout_s: 120      # one fetch
# github:
#   json_timeout_s: 60        # a JSON read (a list, a view, an api GET)
#   log_timeout_s: 300        # any other call, e.g. a long job's log
#   cmd_timeout_s: 30         # a short call outside the forge client (CI queue, pool, alerts)
#   pr_list_limit: 300        # --limit of a `gh pr list` (unset: 300; retention 1000, the lane 500)
#   rate_limit:
#     latch_s: 600            # after a rate-limit answer no gh call is made for this long
#     memo_s: 30              # a read listing is reused this long within a process

# harvest.round_cap: holds in a row on the same finding before the correction goes to adjudicate.
# transplant: the lane rebuilds an approved head's change on the trunk at most `cap` times
# (0: never), each regeneration killed after `regen_timeout_s`.
# harvest:
#   round_cap: 3
#   transplant:
#     cap: 2
#     regen_timeout_s: 900

# merge: the trunk-merge gate (the command run on a branch with the trunk merged in).
# merge:
#   timeout_s: 900
#   fetch_timeout_s: 60

# ci: the CI queue's timings (asf.ci_queue). GitHub-hosted runners pick up and start in other
# times than a self-hosted pool; each automatic rerun costs money.
# ci:
#   stuck_retry_s: 1800       # a stuck cancelled run is tried again this often
#   stale_s: 1800             # a queue entry not asked about in this long has left the line
#   pickup_s: 180             # a run admitted this recently still holds its runners
#   urgent_hold_s: 2700       # how long a priority batch holds PR starts behind it
#   expect_ttl_s: 600         # a workflow's measured jobs per class are reused this long
#   phantom:
#     gap_s: 600              # passes further apart are not consecutive
#     red_s: 600              # a runner busy with no job this long turns doctor red
#   stall:
#     gap_s: 600
#     rerun_max: 2            # stalls on one branch and sha before the run is not re-run
#   job_timeout_min: 360      # a job with no timeout-minutes of its own (the host's default)
#   measure:                  # runner scores (asf.ci_measure)
#     window_days: 14
#     min_readings: 5         # readings before a runner is scored
#     min_green_rate: 0.85    # below this a runner is flaky

# trunk_red: the red-trunk watch (asf.trunk_red).
# trunk_red:
#   seen_hours: 24            # a red check seen within this is still the same red
#   read_every_s: 300         # how often the trunk's checks are read
#   find_wait_s: 1800         # how long a fix is looked for before it is filed
#   max_tries: 2
#   list_every_s: 600
# stale_ref:                  # a workflow run waiting on a ref that never moved
#   wait_s: 1800
#   keep_s: 259200
# trunk_watch:                # commits that bypassed review (asf.trunk_watch)
#   days: 3
#   ruleset_read_s: 86400

# bugs: CI-red cards the tick files (asf.tick.file_bugs).
# bugs:
#   ci_red_window_h: 24       # refusals within this count toward one card
#   check_failure_runs: 3     # failing runs of one rule check before it is surfaced
#   ci_red_title: 'CI red: '  # the card title's prefix (its signature too)

# flaky.title_prefix: a flaky test's card title and signature start with it. Changing it starts
# new signatures (a card under the old prefix is no longer matched).
# flaky:
#   title_prefix: 'flaky e2e: '
#   s1_runs: 3                # flaky runs in window_days that make the card S1
#   window_days: 7
#   lookback_days: 7          # how far back one pass ever reads
#   max_runs: 30              # run logs one pass reads at most

# brief: how much history a session brief carries.
# brief:
#   reservations_max: 12      # held numbers listed per id sequence
#   answers_max: 5            # operator answers quoted
#   judged_commits_max: 20    # commits since the judged head listed

# groom: word-overlap thresholds of the inbox groom (0..1).
# groom:
#   near_duplicate_overlap: 0.6
#   templated_overlap: 0.9

# changelog: the release rollup (asf.metrics). branch: where a changelog commit goes when the
# trunk takes no factory push; notes_max_commits: item-less commits a version lists one by one.
# changelog:
#   branch: asf/changelog
#   notes_max_commits: 30

# tick.dry_run_min_free_bytes: a dry run refuses below this much free disk (default 10 GiB).

# proves:                          # the `Proves:` claim grammar (asf.proves)
#   partial_markers: [only, partial, partly, half, except, not yet, minus]
#                                  # a word in a claim's prose that makes it a *partial* claim:
#                                  # the line is not ticked and the refusal is reported. Replaces
#                                  # the built-in list wholesale; [] turns the rule off.

# Every key above is registered in asf/config_keys.py; a numeric one is checked for its kind and
# range there, and a malformed value keeps its default and is named in doctor's `config keys` row.

# Everything ASF reads and writes lives under ~/.ASF: products/, state/<product>/ (the session
# ledger, the worktrees, the tick's record clone), logs/. Set $ASF_HOME to move all of it.
