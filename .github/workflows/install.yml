name: install

# The preview gate's install criterion: from zero on a clean machine to a green doctor — a Linux
# container with nothing but Python and git, and a macOS runner with a fresh, empty HOME. Each
# installs the package with pipx the way a new user does, then runs the zero-to-green test
# (tests/test_install_e2e.py: `asf install` into a temp home, doctor green, a dry run, again).
# It runs on every push to main, daily, by hand, and on a pull request that touches the install
# path; `asf release-readiness --gate preview` reads the newest run of each step.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/install.sh"
      - "asf/install*.py"
      - "asf/init*.py"
      - "asf/doctor.py"
      - "pyproject.toml"
      - "tests/test_install_e2e.py"
      - ".github/workflows/install.yml"

permissions:
  contents: read

# One run per pull request head ref (a new push cancels the running one); on main the running
# run finishes and a newer push replaces any still pending (see tests.yml).
concurrency:
  group: install-${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-container:
    runs-on: ubuntu-latest
    container: python:3.12
    steps:
      - uses: actions/checkout@v4
      - name: install from zero, Linux container (pipx, doctor green)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name ci
          git config --global user.email ci@localhost
          python3 -m pip install --quiet pipx
          python3 -m pipx install .
          export PATH="$HOME/.local/bin:$PATH"
          asf --version
          python3 -m unittest -v tests.test_install_e2e

  macos-fresh-home:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install from zero, macOS fresh HOME (pipx, doctor green)
        run: |
          export HOME="$(mktemp -d)"
          git config --global user.name ci
          git config --global user.email ci@localhost
          python3 -m pip install --quiet pipx
          python3 -m pipx install --python "$(which python3)" .
          export PATH="$HOME/.local/bin:$PATH"
          asf --version
          python3 -m unittest -v tests.test_install_e2e
