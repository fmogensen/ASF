name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install with pipx
        run: |
          python -m pip install --upgrade pipx
          python -m pipx install --python "$(which python)" .
      - name: asf --version
        run: asf --version
      - name: tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          python3 -m unittest discover -s tests
      - name: the sample product, end to end (init, one tick, next, doctor)
        run: python3 -m unittest -v tests.test_sample_product
