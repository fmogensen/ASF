name: tests

# push is limited to main (B-0053): a push to a worker branch is in-progress work, not a landed
# change, and firing the suite on every one of them is red notifications for work nobody asked to
# gate yet plus wasted minutes. pull_request stays open for outside contributors and for any
# product whose conventions.landing is pull-request, where a branch's gate IS the pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install with pipx
        run: |
          python -m pip install --upgrade pipx
          python -m pipx install --python "$(which python)" .
      - name: asf --version
        run: asf --version
      # TODO: drop continue-on-error once the remaining conventions cards land (the evidence
      # provider is B-0020) — the modules they own still carry the first product's literals, and
      # a red required step on every PR until then would be noise, not a signal.
      - name: check conventions
        run: bash tools/check_conventions.sh
      - name: plugin is generated from the CLI
        run: asf plugin check
      - name: tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          python3 -m unittest discover -s tests
      - name: the sample product, end to end (init, one tick, next, doctor)
        run: python3 -m unittest -v tests.test_sample_product
      # F-0087 (B-0033, B-0038, B-0043, B-0047): the suite is hermetic. It runs once more under
      # `env -i` with an operator-like home that names this checkout as the product `asf`,
      # ASF_PRODUCT exported the way the tick exports it, and a host git config whose
      # init.defaultBranch is not `main`. A test that reads the operator's home, the caller's
      # identity or the host's git defaults goes red here, on a plain install.
      - name: the suite is hermetic (env -i, an operator home, ASF_PRODUCT set, foreign default branch)
        run: |
          OPERATOR="$RUNNER_TEMP/operator"
          mkdir -p "$OPERATOR/.ASF/products"
          printf 'default_product: asf\nscheduler:\n  kind: none\n' > "$OPERATOR/.ASF/config.yaml"
          printf 'product: asf\nrepo_dir: %s\nbacklog_dir: %s\nmain: main\n' "$PWD" "$OPERATOR/record" > "$OPERATOR/.ASF/products/asf.yaml"
          HOME="$OPERATOR" git config --global user.name ci
          HOME="$OPERATOR" git config --global user.email ci@localhost
          HOME="$OPERATOR" git config --global init.defaultBranch master
          env -i PATH="$PATH" HOME="$OPERATOR" ASF_HOME="$OPERATOR/.ASF" ASF_PRODUCT=asf \
            python3 -m unittest discover -s tests
