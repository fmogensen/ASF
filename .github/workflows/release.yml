name: release

# Every merge to main that changes asf/ gets the next patch version: a v<x.y.z> tag and a
# CHANGELOG entry (asf/version.py). It runs on the push, so a merge is versioned however it
# landed — a direct `gh pr merge`, the factory's lane or merge queue, or the native landing.
# The PR job shows the release-notes line the merge will get, and fails when there is none.
#
# The PR job's verdict depends only on the PR's title, body and diff, so it runs on exactly the
# events that change one of those: opened, edited (title/body/base), synchronize (a new head).
# A reopen of an unchanged head (the stale-merge-ref replay) changes none of them and would only
# fire a second red beside the tests workflow's, so it does not run on one.
#
# A pre-release (`v<x.y.z>-<label>`, e.g. v0.1.0-preview) is cut by hand: run this workflow on
# main with its tag. The `preview` job first runs `asf release-readiness --gate preview` against
# this repository as a product and stops when it is not green; only then does it tag main's head
# (`python3 -m asf.version prerelease`, never moving an existing tag) and publish a GitHub
# pre-release whose notes are docs/RELEASE-NOTES.md. Pre-release tags never count as versions:
# the patch tags above go on as before.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize]
  workflow_dispatch:
    inputs:
      tag:
        description: "the pre-release tag to cut (v<x.y.z>-<label>)"
        required: true
        default: v0.1.0-preview

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag every unversioned merge and file its changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "asf-release"
          git config user.email "asf-release@users.noreply.github.com"
          git fetch -q --tags origin
          python3 -m asf.version cut --ref "$GITHUB_SHA" --push
      - name: the release rule holds on main
        run: |
          git fetch -q --tags origin main
          python3 -m asf.version check --ref origin/main

  notes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      # CI tooling runs from the trunk, never from the branch: a branch cut before a tool existed
      # (or carrying an older copy of it) must not turn this check red for a reason the PR
      # didn't cause. The head is only the data: its diff against the base.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: .asf-ci-base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the release-notes line this merge will get
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          cd "$GITHUB_WORKSPACE/.asf-ci-base"
          python3 -m asf.version pr --repo "$GITHUB_WORKSPACE" --base "origin/$BASE_REF" \
            --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"

  preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the preview gate is green (asf release-readiness --gate preview)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet .
          git fetch -q --tags origin main
          name="$(printf '%s' "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')"
          export ASF_HOME="$RUNNER_TEMP/asf-home"
          mkdir -p "$ASF_HOME/products" "$RUNNER_TEMP/record"
          printf 'default_product: %s\nscheduler:\n  kind: none\n' "$name" > "$ASF_HOME/config.yaml"
          printf 'product: %s\nrepo_slug: %s\nrepo_dir: %s\nbacklog_dir: %s\nmain: main\n' \
            "$name" "$GITHUB_REPOSITORY" "$PWD" "$RUNNER_TEMP/record" > "$ASF_HOME/products/$name.yaml"
          asf release-readiness --gate preview --product "$name"
      - name: cut the pre-release tag and its GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "asf-release"
          git config user.email "asf-release@users.noreply.github.com"
          python3 -m asf.version prerelease --tag "$TAG" --ref "$GITHUB_SHA" --push
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --verify-tag --title "$TAG" --notes-file docs/RELEASE-NOTES.md
